<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CubesAdy Knight</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #020d1d;
    color: white;
}


/* =========================================================
   GAME
========================================================= */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-color: #031426;

    background-image:
        linear-gradient(
            rgba(20, 116, 165, 0.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(20, 116, 165, 0.18) 1px,
            transparent 1px
        );

    background-size: 50px 50px;
}


/* =========================================================
   BACKGROUND STARS
========================================================= */

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #bdeaff;

    opacity: .65;
}


/* =========================================================
   HP PANEL
========================================================= */

.hp-panel {
    position: absolute;

    left: 25px;
    top: 28px;

    width: 379px;
    height: 102px;

    padding: 20px 24px;

    border: 1px solid #126487;
    border-radius: 20px;

    background: rgba(3, 24, 49, .94);

    box-shadow:
        0 0 20px rgba(0, 140, 220, .08);
}

.hp-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.hp-label {
    display: flex;
    align-items: center;

    gap: 9px;

    font-size: 20px;
    font-weight: bold;
}

.heart {
    color: #ff68a8;

    font-size: 26px;

    filter:
        drop-shadow(
            0 0 8px #ff3b8b
        );
}

.hp-number {
    font-size: 21px;
    font-weight: bold;
}

.hp-bar {
    width: 100%;
    height: 18px;

    margin-top: 12px;

    border-radius: 20px;

    background: #152d48;

    border: 1px solid #284b67;

    overflow: hidden;
}

.hp-fill {
    width: 64%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #22dbc1,
            #2ac8ed
        );

    transition:
        width .3s ease;
}


/* =========================================================
   SCORE
========================================================= */

.score-panel {
    position: absolute;

    left: 25px;
    top: 146px;

    height: 49px;

    padding: 13px 24px;

    border: 1px solid #126487;
    border-radius: 17px;

    background: rgba(3, 24, 49, .94);

    font-size: 16px;
    font-weight: bold;
}

.score {
    color: #ffd438;
}

.diamond {
    color: #58cfff;

    margin-left: 14px;
}


/* =========================================================
   ONLINE
========================================================= */

.online {
    position: absolute;

    right: 25px;
    top: 30px;

    padding: 13px 19px;

    border: 1px solid #126487;
    border-radius: 18px;

    background: rgba(3, 24, 49, .94);

    font-size: 16px;
    font-weight: bold;
}

.online-dot {
    display: inline-block;

    width: 11px;
    height: 11px;

    margin-right: 9px;

    border-radius: 50%;

    background: #2df0bd;

    box-shadow:
        0 0 12px #2df0bd;
}


/* =========================================================
   MINIMAP
========================================================= */

.minimap {
    position: absolute;

    right: 25px;
    top: 88px;

    width: 292px;
    height: 210px;

    border: 1px solid #126487;

    border-radius: 20px;

    overflow: hidden;

    background-color: #061b31;

    background-image:
        linear-gradient(
            rgba(20, 126, 165, .18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(20, 126, 165, .18) 1px,
            transparent 1px
        );

    background-size: 32px 32px;
}

.map-dot {
    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    box-shadow: 0 0 10px currentColor;
}

.map-cyan {
    background: #45eaff;
    color: #45eaff;
}

.map-pink {
    background: #ff3e68;
    color: #ff3e68;
}

.map-yellow {
    background: #ffd43b;
    color: #ffd43b;
}

.map-purple {
    background: #a954ff;
    color: #a954ff;
}


/* =========================================================
   MENU
   SEKARANG DI SEBELAH KIRI
========================================================= */

.menu {
    position: absolute;

    left: 25px;
    top: 215px;

    display: flex;

    flex-direction: column;

    gap: 8px;

    width: 180px;
}

.menu-btn {
    width: 180px;
    height: 44px;

    padding: 0 17px;

    border: 1px solid #126487;
    border-radius: 15px;

    background: rgba(3, 24, 49, .94);

    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    text-align: left;

    transition:
        .2s ease;
}

.menu-btn:hover {
    background: #0d3653;

    transform:
        translateX(4px);

    box-shadow:
        0 0 15px
        rgba(40, 190, 255, .2);
}

.menu-btn:active {
    transform:
        scale(.94);
}


/* =========================================================
   PLAYER
========================================================= */

.player {
    position: absolute;

    left: 59.3%;
    top: 53.3%;

    width: 60px;
    height: 60px;

    border-radius: 12px;

    background: #ff3d68;

    box-shadow:
        0 0 13px #ff3d68,
        0 0 30px rgba(255, 61, 104, .45);

    transition:
        left .05s linear,
        top .05s linear;
}

.player::before,
.player::after {
    content: "";

    position: absolute;

    top: 20px;

    width: 8px;
    height: 8px;

    background: white;
}

.player::before {
    left: 15px;
}

.player::after {
    right: 15px;
}

.player-top {
    position: absolute;

    left: 0;
    top: -12px;

    width: 60px;
    height: 7px;

    background: #ff3d68;
}


/* =========================================================
   ENEMY
========================================================= */

.enemy {
    position: absolute;

    left: 74%;
    top: 60%;

    width: 48px;
    height: 48px;

    border-radius: 10px;

    background: #a94cff;

    box-shadow:
        0 0 25px #a94cff;

    transition:
        .15s ease;
}


/* =========================================================
   CONTROLLER
========================================================= */

.controller {
    position: absolute;

    left: 30px;
    bottom: 76px;

    width: 320px;
    height: 210px;
}

.direction {
    position: absolute;

    width: 100px;
    height: 100px;

    border: 1px solid #087fa9;
    border-radius: 22px;

    background: rgba(3, 24, 49, .9);

    color: white;

    font-size: 38px;

    cursor: pointer;

    transition:
        .1s;
}

.direction:hover {
    background: #0c3855;
}

.direction:active {
    transform:
        scale(.91);

    background: #104a6b;
}

.up {
    left: 110px;
    top: 0;
}

.left {
    left: 0;
    bottom: 0;
}

.down {
    left: 110px;
    bottom: 0;
}

.right {
    right: 0;
    bottom: 0;
}


/* =========================================================
   ATTACK BUTTON
========================================================= */

.attack {
    position: absolute;

    right: 28px;
    bottom: 75px;

    width: 378px;
    height: 88px;

    border: none;

    border-radius: 24px;

    background:
        linear-gradient(
            90deg,
            #d8277e,
            #a62fd4
        );

    color: white;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 25px
        rgba(218, 39, 127, .48);

    transition:
        .15s ease;
}

.attack:hover {
    transform:
        scale(1.015);

    box-shadow:
        0 0 35px
        rgba(218, 39, 127, .7);
}

.attack:active {
    transform:
        scale(.95);
}


/* =========================================================
   CONTROL GUIDE
========================================================= */

.guide {
    position: absolute;

    left: 50%;
    bottom: 17px;

    transform:
        translateX(-50%);

    padding: 10px 21px;

    border: 1px solid #103d5b;
    border-radius: 13px;

    background:
        rgba(3, 24, 49, .9);

    color: #a5b6c6;

    font-size: 14px;
}

.guide strong {
    color: #3bdeeb;
}


/* =========================================================
   ATTACK EFFECT
========================================================= */

.attack-effect {
    position: absolute;

    width: 120px;
    height: 120px;

    border:
        5px solid #ff4b91;

    border-radius: 50%;

    pointer-events: none;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.3);

    box-shadow:
        0 0 25px #ff4b91;
}

.attack-effect.active {
    animation:
        attack .3s ease-out;
}

@keyframes attack {

    0% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(.3);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.4);
    }
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;

    background:
        rgba(0, 10, 25, .72);

    backdrop-filter:
        blur(5px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 420px;

    padding: 32px;

    border: 1px solid #1abde8;
    border-radius: 22px;

    background: #061a30;

    box-shadow:
        0 0 35px
        rgba(0, 200, 255, .25);

    animation:
        modalIn .2s ease;
}

@keyframes modalIn {

    from {
        opacity: 0;

        transform:
            translateY(20px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

.modal h2 {
    margin-bottom: 20px;
}

.modal p {
    margin: 10px 0;

    color: #b7c9d9;
}

.modal-action {
    width: 100%;

    margin-top: 10px;

    padding: 13px;

    border:
        1px solid #176484;

    border-radius: 12px;

    background: #092b45;

    color: white;

    cursor: pointer;
}

.modal-action:hover {
    background: #10476b;
}


/* =========================================================
   TUTORIAL
========================================================= */

.tutorial {
    text-align: center;
}

.tutorial h1 {
    font-size: 34px;

    margin-bottom: 18px;
}

.tutorial p {
    color: #b8cada;

    line-height: 1.7;

    margin-bottom: 25px;
}

.start {
    padding: 14px 34px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #24d9ca,
            #2bc9f2
        );

    color: #00121e;

    font-weight: bold;

    cursor: pointer;
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {
    position: absolute;

    left: 50%;
    bottom: 120px;

    transform:
        translateX(-50%);

    padding: 10px 18px;

    border-radius: 9px;

    background:
        rgba(0,0,0,.78);

    color: white;

    opacity: 0;

    transition:
        opacity .2s;

    pointer-events: none;
}

.subtitle.show {
    opacity: 1;
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

body.colorblind #game {
    filter:
        saturate(.45)
        contrast(1.15);
}

body.large-text {
    font-size: 115%;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {

    .hp-panel {
        transform:
            scale(.85);

        transform-origin:
            top left;
    }

    .minimap {
        transform:
            scale(.8);

        transform-origin:
            top right;
    }

    .attack {
        width: 300px;
    }
}

</style>
</head>


<body>

<div id="game">


    <!-- STARS -->

    <div class="star" style="left:23%;top:22%;"></div>
    <div class="star" style="left:33%;top:36%;"></div>
    <div class="star" style="left:43%;top:15%;"></div>
    <div class="star" style="left:52%;top:30%;"></div>
    <div class="star" style="left:65%;top:17%;"></div>
    <div class="star" style="left:75%;top:47%;"></div>
    <div class="star" style="left:43%;top:73%;"></div>
    <div class="star" style="left:20%;top:65%;"></div>


    <!-- HP -->

    <div class="hp-panel">

        <div class="hp-top">

            <div class="hp-label">

                <span class="heart">♥</span>

                <span>HP</span>

            </div>

            <div class="hp-number">

                <span id="hp">64</span>/100

        </div>


        <div class="hp-bar">

    <div class="minimap">

        <div
            class="map-dot map-cyan"
            style="
                left:0;

            ">
        </div>


        <div

            style="
                left:90px;

        <div
            class="map-dot map-pink"
            style="

        <div
            class="map-dot map-yellow"
            style="

            ">

    <!-- PLAYER -->

    <div

                    selected>

<script>

/* =========================================================
   GAME VARIABLES
========================================================= */

const player =
    document.getElementById("player");

const enemy =
    document.getElementById("enemy");

const hpText =
    document.getElementById("hp");

const hpFill =
    document.getElementById("hpFill");

const scoreText =
    document.getElementById("score");

const diamondText =
    document.getElementById("diamond");

const attackEffect =
    document.getElementById("attackEffect");

const subtitle =
    document.getElementById("subtitle");


let x =
    window.innerWidth * .593;

let y =
    window.innerHeight * .533;


let hp = 64;

let score = 20;

let diamond = 2;

let speed = 5;

let playing = false;

let paused = false;

let subtitleEnabled = true;


const keys = {};


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer() {

    player.style.left =
        x + "px";

    player.style.top =
        y + "px";

}


/* =========================================================
   KEYBOARD CONTROL
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            attack();

            return;

        }


        if (
            event.code === "Escape"
        ) {

            if (playing) {

                pauseGame();

            }

            return;

        }


        keys[
            event.key.toLowerCase()
        ] = true;

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (
        playing &&
        !paused
    ) {


        if (
            keys["w"] ||
            keys["arrowup"]
        ) {

            y -= speed;

        }


        if (
            keys["s"] ||
            keys["arrowdown"]
        ) {

            y += speed;

        }


        if (
            keys["a"] ||
            keys["arrowleft"]
        ) {

            x -= speed;

        }


        if (
            keys["d"] ||
            keys["arrowright"]
        ) {

            x += speed;

        }


        x = Math.max(
            0,
            Math.min(
                window.innerWidth - 60,
                x
            )
        );


        y = Math.max(
            0,
            Math.min(
                window.innerHeight - 60,
                y
            )
        );


        updatePlayer();

    }


    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();


/* =========================================================
   TOUCH CONTROLLER
========================================================= */

document
.querySelectorAll(".direction")
.forEach(button => {

    const key =
        button.dataset.key.toLowerCase();


    button.addEventListener(
        "mousedown",
        function() {

            keys[key] = true;

        }
    );


    button.addEventListener(
        "mouseup",
        function() {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "mouseleave",
        function() {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();

            keys[key] = false;

        }
    );

});


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    document
    .getElementById("tutorial")
    .classList.remove("show");


    playing = true;

    paused = false;


    showSubtitle(
        "🎮 Game dimulai!"
    );

}


/* =========================================================
   ATTACK
========================================================= */

function attack() {

    if (
        !playing ||
        paused
    ) {

        return;

    }


    const rect =
        player.getBoundingClientRect();


    attackEffect.style.left =
        (
            rect.left + 30
        ) + "px";


    attackEffect.style.top =
        (
            rect.top + 30
        ) + "px";


    attackEffect.classList.remove(
        "active"
    );


    void attackEffect.offsetWidth;


    attackEffect.classList.add(
        "active"
    );


    score += 5;


    scoreText.textContent =
        score;


    showSubtitle(
        "⚔ SERANG!"
    );


    const enemyRect =
        enemy.getBoundingClientRect();


    const dx =
        rect.left -
        enemyRect.left;


    const dy =
        rect.top -
        enemyRect.top;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance < 160
    ) {

        enemy.style.transform =
            "scale(.65)";


        enemy.style.opacity =
            ".5";


        showSubtitle(
            "💥 Musuh terkena!"
        );


        setTimeout(
            function() {

                enemy.style.transform =
                    "scale(1)";

                enemy.style.opacity =
                    "1";

            },
            200
        );

    }

}


/* =========================================================
   ATTACK BUTTON
========================================================= */

document
.getElementById("attackButton")
.addEventListener(
    "click",
    attack
);


/* =========================================================
   PAUSE
========================================================= */

function pauseGame() {

    if (!playing)
        return;


    paused = true;


    document
    .getElementById("pauseModal")
    .classList.add("show");

}


function resumeGame() {

    paused = false;


    document
    .getElementById("pauseModal")
    .classList.remove("show");

}


/* =========================================================
   EXIT
========================================================= */

function exitGame() {

    playing = false;

    paused = false;


    document
    .getElementById("pauseModal")
    .classList.remove("show");


    document
    .getElementById("tutorial")
    .classList.add("show");

}


/* =========================================================
   MENU
========================================================= */

function openMenu(name) {

    const modal =
        document.getElementById(
            "menuModal"
        );


    const title =
        document.getElementById(
            "menuTitle"
        );


    const content =
        document.getElementById(
            "menuContent"
        );


    title.innerText =
        name;


    if (
        name === "Lobby"
    ) {

        content.innerHTML =
            "<p>🏠 Kamu berada di Lobby.</p>";

    }


    if (
        name === "Players"
    ) {

        content.innerHTML =
            "<p>🟢 Player 1</p>" +
            "<p>🟢 Player 2</p>" +
            "<p>🟢 Player 3</p>" +
            "<p>🟢 Player 4</p>";

    }


    if (
        name === "Chat"
    ) {

        content.innerHTML =
            "<p>💬 Welcome, Knight!</p>" +
            "<p>💬 Good luck!</p>";

    }


    if (
        name === "Rank"
    ) {

        content.innerHTML =
            "<p>🥇 Knight — 1200</p>" +
            "<p>🥈 Shadow — 980</p>" +
            "<p>🥉 Cube — 850</p>";

    }


    if (
        name === "Match"
    ) {

        content.innerHTML =
            "<p>🎯 Match sedang berlangsung.</p>";

    }


    modal.classList.add(
        "show"
    );

}


function closeMenu() {

    document
    .getElementById("menuModal")
    .classList.remove("show");

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

    document
    .getElementById("pauseModal")
    .classList.remove("show");


    document
    .getElementById("settingsModal")
    .classList.add("show");

}


function toggleColorblind() {

    document.body
    .classList.toggle(
        "colorblind"
    );

}


function toggleLargeText() {

    document.body
    .classList.toggle(
        "large-text"
    );

}


function toggleSubtitle() {

    subtitleEnabled =
        !subtitleEnabled;

}


function saveSettings() {

    const difficulty =
        document
        .getElementById(
            "difficulty"
        )
        .value;


    if (
        difficulty === "easy"
    ) {

        speed = 4;

    }


    if (
        difficulty === "normal"
    ) {

        speed = 5;

    }


    if (
        difficulty === "hard"
    ) {

        speed = 8;

    }


    document
    .getElementById(
        "settingsModal"
    )
    .classList.remove(
        "show"
    );


    document
    .getElementById(
        "pauseModal"
    )
    .classList.add(
        "show"
    );

}


/* =========================================================
   SUBTITLE
========================================================= */

function showSubtitle(text) {

    if (!subtitleEnabled)
        return;


    subtitle.innerText =
        text;


    subtitle.classList.add(
        "show"
    );


    setTimeout(
        function() {

            subtitle.classList.remove(
                "show"
            );

        },
        1800
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    updatePlayer
);

</script>
