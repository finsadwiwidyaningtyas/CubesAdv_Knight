<style>
*{

html,body{

body{

/* ================= BACKGROUND ================= */

#game{
  position:fixed;
  inset:0;

#game:after{

.hud{

/* ================= ENEMY ================= */

.gem{

    linear-gradient(

      #bfffff 0%,

      #1151ce 100%
    );

    0 0 12px #25e4ff,
    0 0 25px #25e4ff,
    0 0 55px #218cff66,

    inset -7px -7px 10px #0751b988;

  animation:
    floatGem 1.6s infinite ease-in-out,
    gemGlow 2s infinite ease-in-out;

.gem:before{
  content:"";

  inset:5px;

    linear-gradient(

.toast{

<script>

/* =========================================================
   GAME VARIABLES
========================================================= */

const p =
  document.getElementById('player');

const hpEl =
  document.getElementById('hp');

const fill =
  document.getElementById('fill');

const sc =
  document.getElementById('score');

const gm =
  document.getElementById('gems');

const t =
  document.getElementById('toast');

const modal =
  document.getElementById('modal');

const online =
  document.getElementById('online');

let x = 48;
let y = 54;

let hp = 76;
let score = 0;
let gems = 0;

let paused = false;

let keys = {};


/* =========================================================
   CLAMP
========================================================= */

const clamp =
(v,a,b) =>
Math.max(a,Math.min(b,v));


/* =========================================================
   RENDER
========================================================= */

function render(){

  p.style.left =
    x + '%';

  p.style.top =
    y + '%';

  hpEl.textContent =
    hp + '/100';

  fill.style.width =
    hp + '%';

  sc.textContent =
    score;

  gm.textContent =
    gems;
}


/* =========================================================
   MOVE
========================================================= */

function move(dx,dy){

  if(paused)
    return;

  x =
    clamp(
      x + dx,
      5,
      95
    );

  y =
    clamp(
      y + dy,
      16,
      90
    );

  render();
}


/* =========================================================
   TOAST
========================================================= */

function toast(s){

  t.textContent =
    s;

  t.classList.add('show');

  clearTimeout(
    window.tt
  );

  window.tt =
    setTimeout(
      () =>
        t.classList.remove('show'),
      850
    );
}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

  if(
    paused ||
    hp <= 0
  )
    return;

  score += 10;

  if(
    Math.random() < .35
  ){

    gems++;

    toast(
      '💎 +1 GEM!'
    );

  }else{

    toast(
      '⚔️ SERANG! +10 SCORE'
    );

  }

  if(
    Math.random() < .22
  ){

    hp =
      Math.max(
        0,
        hp - 3
      );

    toast(
      '💥 -3 HP'
    );

  }

  render();

  if(hp <= 0){

    toast(
      '☠️ Kalah — tekan R'
    );

  }

}


/* =========================================================
   PAUSE
========================================================= */

function pause(){

  paused =
    !paused;

  modal.style.display =
    paused
      ? 'grid'
      : 'none';
}


/* =========================================================
   KEYBOARD
========================================================= */

window.onkeydown =
function(e){

  keys[e.key] = 1;

  if(
    e.code === 'Space'
  ){

    e.preventDefault();

    attack();

  }

  if(
    e.key.toLowerCase()
    === 'p'
  ){

    pause();

  }

  if(
    e.key.toLowerCase()
    === 'r' &&
    hp <= 0
  ){

    hp = 76;

    score = 0;

    gems = 0;

    x = 48;

    y = 54;

    render();

    toast(
      '🔄 RESET'
    );

  }

};


/* =========================================================
   KEY UP
========================================================= */

window.onkeyup =
function(e){

  keys[e.key] = 0;

};


/* =========================================================
   MOVEMENT LOOP
========================================================= */

setInterval(
function(){

  if(paused)
    return;

  let dx = 0;
  let dy = 0;

  if(
    keys.ArrowLeft ||
    keys.a
  )
    dx -= .7;

  if(
    keys.ArrowRight ||
    keys.d
  )
    dx += .7;

  if(
    keys.ArrowUp ||
    keys.w
  )
    dy -= .7;

  if(
    keys.ArrowDown ||
    keys.s
  )
    dy += .7;

  if(
    dx ||
    dy
  )
    move(dx,dy);

},
30
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
.querySelectorAll('.ctrl')
.forEach(
function(b){

  b.onpointerdown =
  function(e){

    e.preventDefault();

    let k =
      b.dataset.k;

    move(
      k === 'ArrowLeft'
        ? -2.2
        : k === 'ArrowRight'
          ? 2.2
          : 0,

      k === 'ArrowUp'
        ? -2.2
        : k === 'ArrowDown'
          ? 2.2
          : 0
    );

  };

});


/* =========================================================
   SCORE TIMER
========================================================= */

setInterval(
function(){

  if(!paused){

    score++;

    render();

  }

},
1500
);


/* =========================================================
   START
========================================================= */

render();

</script>

</html>
