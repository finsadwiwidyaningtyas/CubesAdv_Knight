<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CubesAdy Knight</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#020b18;
    color:white;
}


/* =====================================================
   GAME
===================================================== */

#game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background-color:#020d1d;

    background-image:

        linear-gradient(
            rgba(20,116,165,.17) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(20,116,165,.17) 1px,
            transparent 1px
        );

    background-size:
        46px 46px;

}


/* =====================================================
   STAR
===================================================== */

.star{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#b9e9ff;

    opacity:.6;

    box-shadow:
        0 0 8px #65d9ff;

}


/* =====================================================
   HP
===================================================== */

.hp-panel{

    position:absolute;

    left:25px;
    top:25px;

    width:380px;

    padding:19px 23px;

    border:1px solid #11648b;

    border-radius:20px;

    background:
        rgba(3,24,49,.96);

    z-index:100;

    box-shadow:
        0 0 25px
        rgba(0,155,235,.08);

}

.hp-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.hp-label{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:20px;

    font-weight:bold;

}

.heart{

    color:#ff67a7;

    font-size:27px;

    filter:
        drop-shadow(
            0 0 8px #ff3d8b
        );

}

.hp-number{

    font-size:21px;

    font-weight:bold;

}

.hp-bar{

    width:100%;

    height:18px;

    margin-top:13px;

    overflow:hidden;

    border:1px solid #284a66;

    border-radius:20px;

    background:#142b45;

}

.hp-fill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #20d9bd,
            #2cc8ed
        );

    box-shadow:
        0 0 15px #23d8d5;

    transition:
        width .25s ease;

}


/* =====================================================
   SCORE
===================================================== */

.score-panel{

    position:absolute;

    left:25px;
    top:145px;

    padding:13px 22px;

    border:1px solid #11648b;

    border-radius:17px;

    background:
        rgba(3,24,49,.96);

    font-size:16px;

    font-weight:bold;

    z-index:100;

}

.score{

    color:#ffd438;

}

.diamond{

    color:#58cfff;

    margin-left:12px;

}


/* =====================================================
   TOP MENU
===================================================== */

.top-menu{

    position:absolute;

    left:430px;
    top:32px;

    display:flex;

    gap:8px;

    z-index:100;

}

.menu-btn{

    height:46px;

    padding:
        0 16px;

    border:
        1px solid
        rgba(25,157,210,.65);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(8,39,66,.96),
            rgba(3,24,46,.96)
        );

    color:white;

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    cursor:pointer;

    transition:.2s;

}

.menu-btn:hover{

    transform:
        translateY(-2px);

    border-color:#28c8f4;

    box-shadow:
        0 0 18px
        rgba(28,197,245,.25);

}


/* =====================================================
   ONLINE
===================================================== */

.online{

    position:absolute;

    right:25px;
    top:30px;

    padding:
        13px 19px;

    border:1px solid #11648b;

    border-radius:18px;

    background:
        rgba(3,24,49,.96);

    font-size:16px;

    font-weight:bold;

    z-index:100;

}

.online-dot{

    display:inline-block;

    width:11px;
    height:11px;

    margin-right:9px;

    border-radius:50%;

    background:#2df0bd;

    box-shadow:
        0 0 12px #2df0bd;

}


/* =====================================================
   MINIMAP
===================================================== */

.minimap{

    position:absolute;

    right:25px;
    top:105px;

    width:292px;
    height:210px;

    overflow:hidden;

    border:1px solid #11648b;

    border-radius:20px;

    background-color:#061b31;

    background-image:

        linear-gradient(
            rgba(20,126,165,.17) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(20,126,165,.17) 1px,
            transparent 1px
        );

    background-size:32px 32px;

    z-index:80;

}


/* =====================================================
   SNAKE
===================================================== */

.snake{

    position:absolute;

    width:100%;

    height:100%;

    pointer-events:none;

    z-index:30;

}


/* =====================================================
   SNAKE SEGMENT
===================================================== */

.segment{

    position:absolute;

    width:38px;
    height:38px;

    border-radius:9px;

    transform:
        translate(-50%,-50%);

    transition:
        transform .05s linear;

}


/* =====================================================
   RED SNAKE BODY
===================================================== */

.player-segment{

    background:
        linear-gradient(
            145deg,
            #ff6687,
            #ed2859
        );

    box-shadow:

        0 0 9px
        #ff3c68,

        0 0 22px
        rgba(255,55,100,.65);

}


/* =====================================================
   PURPLE SNAKE BODY
===================================================== */

.enemy-segment{

    background:
        linear-gradient(
            145deg,
            #bf70ff,
            #8434df
        );

    box-shadow:

        0 0 9px
        #a94cff,

        0 0 22px
        rgba(169,76,255,.65);

}


/* =====================================================
   SNAKE HEAD
===================================================== */

.snake-head{

    position:absolute;

    width:76px;
    height:76px;

    border-radius:16px;

    transform:
        translate(-50%,-50%);

    z-index:50;

}


/* =====================================================
   PLAYER HEAD
===================================================== */

.player-head{

    background:
        linear-gradient(
            145deg,
            #ff6685,
            #f3265b
        );

    box-shadow:

        0 0 18px
        #ff3b67,

        0 0 45px
        rgba(255,45,100,.75);

}


/* =====================================================
   ENEMY HEAD
===================================================== */

.enemy-head{

    background:
        linear-gradient(
            145deg,
            #c36cff,
            #8934e4
        );

    box-shadow:

        0 0 18px
        #a94cff,

        0 0 45px
        rgba(169,76,255,.75);

}


/* =====================================================
   EYES
===================================================== */

.eye{

    position:absolute;

    top:27px;

    width:10px;
    height:10px;

    border-radius:2px;

    background:white;

    box-shadow:
        0 0 7px white;

}

.eye.left{
    left:20px;
}

.eye.right{
    right:20px;
}


/* =====================================================
   HEALTH BAR
===================================================== */

.snake-health{

    position:absolute;

    top:-19px;
    left:50%;

    transform:
        translateX(-50%);

    width:82px;
    height:8px;

    border-radius:10px;

    background:#182032;

    overflow:hidden;

}

.snake-health-fill{

    width:100%;

    height:100%;

    background:#ff3e68;

    box-shadow:
        0 0 10px #ff3e68;

    transition:
        width .15s;

}


/* =====================================================
   DAMAGE NUMBER
===================================================== */

.damage-number{

    position:absolute;

    color:#ff6684;

    font-size:25px;

    font-weight:bold;

    pointer-events:none;

    z-index:200;

    text-shadow:
        0 0 12px #ff3d68;

    animation:
        damageFloat .8s
        ease-out
        forwards;

}

@keyframes damageFloat{

    0%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

    100%{

        opacity:0;

        transform:
            translateY(-60px)
            scale(1.15);

    }

}


/* =====================================================
   PARTICLE
===================================================== */

.particle{

    position:absolute;

    width:6px;
    height:6px;

    border-radius:2px;

    pointer-events:none;

    z-index:20;

    animation:
        particleFade .7s
        ease-out
        forwards;

}

@keyframes particleFade{

    0%{

        opacity:.9;

        transform:
            scale(1)
            translate(0,0);

    }

    100%{

        opacity:0;

        transform:
            scale(.1)
            translate(
                var(--dx),
                var(--dy)
            );

    }

}


/* =====================================================
   CONTROLLER
===================================================== */

.controller{

    position:absolute;

    left:30px;
    bottom:75px;

    width:320px;
    height:210px;

    z-index:100;

}

.direction{

    position:absolute;

    width:100px;
    height:100px;

    border:1px solid #087fa9;

    border-radius:22px;

    background:
        rgba(3,24,49,.9);

    color:white;

    font-size:38px;

    cursor:pointer;

}

.direction:active{

    transform:
        scale(.92);

}

.up{

    left:110px;
    top:0;

}

.left{

    left:0;
    bottom:0;

}

.down{

    left:110px;
    bottom:0;

}

.right{

    right:0;
    bottom:0;

}


/* =====================================================
   ATTACK BUTTON
===================================================== */

.attack{

    position:absolute;

    right:28px;
    bottom:75px;

    width:378px;
    height:88px;

    border:none;

    border-radius:24px;

    background:
        linear-gradient(
            90deg,
            #d8277e,
            #a62fd4
        );

    color:white;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

    z-index:100;

    box-shadow:
        0 0 30px
        rgba(218,39,127,.5);

    transition:.15s;

}

.attack:hover{

    transform:
        scale(1.02);

}

.attack:active{

    transform:
        scale(.95);

}


/* =====================================================
   ATTACK RING
===================================================== */

.attack-ring{

    position:absolute;

    width:140px;
    height:140px;

    border:
        5px solid #ff4b91;

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.3);

    z-index:70;

}

.attack-ring.active{

    animation:
        attackRing .35s
        ease-out;

}

@keyframes attackRing{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.3);

    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.5);

    }

}


/* =====================================================
   GUIDE
===================================================== */

.guide{

    position:absolute;

    left:50%;
    bottom:17px;

    transform:
        translateX(-50%);

    padding:
        10px 21px;

    border:
        1px solid #103d5b;

    border-radius:13px;

    background:
        rgba(3,24,49,.92);

    color:#a5b6c6;

    font-size:14px;

    z-index:100;

}

.guide strong{

    color:#3bdeeb;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,10,25,.75);

    backdrop-filter:
        blur(6px);

    z-index:500;

}

.modal.show{

    display:flex;

}

.modal-box{

    width:430px;

    padding:35px;

    border:
        1px solid #1abde8;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #071f36,
            #041426
        );

    box-shadow:
        0 0 40px
        rgba(0,200,255,.22);

}

.modal h1{

    margin-bottom:20px;

}

.modal p{

    color:#b7c9d9;

    line-height:1.7;

    margin-bottom:20px;

}

.modal-btn{

    width:100%;

    margin-top:10px;

    padding:14px;

    border:
        1px solid #176484;

    border-radius:12px;

    background:#092b45;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

.modal-btn:hover{

    background:#10476b;

}

.start{

    width:100%;

    padding:15px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            90deg,
            #24d9ca,
            #2bc9f2
        );

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

    position:absolute;

    left:50%;
    bottom:120px;

    transform:
        translateX(-50%);

    padding:
        10px 18px;

    border-radius:10px;

    background:
        rgba(0,0,0,.8);

    opacity:0;

    z-index:300;

    transition:
        opacity .2s;

}

.subtitle.show{

    opacity:1;

}


/* =====================================================
   GAME OVER
===================================================== */

.game-over h1{

    color:#ff4d71;

    font-size:42px;

    text-align:center;

}

.final-score{

    text-align:center;

    font-size:24px;

    color:#ffd438;

    margin:20px 0;

}

</style>
</head>


<body>


<div id="game">


<!-- =====================================================
     STARS
===================================================== -->

<div class="star" style="left:20%;top:20%"></div>
<div class="star" style="left:33%;top:8%"></div>
<div class="star" style="left:48%;top:28%"></div>
<div class="star" style="left:63%;top:18%"></div>
<div class="star" style="left:76%;top:42%"></div>
<div class="star" style="left:42%;top:72%"></div>

<!-- =====================================================

    <button

<script>

/* =====================================================
   ELEMENT
===================================================== */

const game =
    document.getElementById("game");

const playerSnake =
    document.getElementById("playerSnake");

const enemySnake =
    document.getElementById("enemySnake");

const hpText =
    document.getElementById("hp");

const hpFill =
    document.getElementById("hpFill");

const scoreText =
    document.getElementById("score");

const diamondText =
    document.getElementById("diamond");

const attackRing =
    document.getElementById("attackRing");

const subtitle =
    document.getElementById("subtitle");


/* =====================================================
   SNAKE DATA
===================================================== */

const SEGMENTS = 9;


/*
    Riwayat posisi kepala.
    Inilah yang membuat badan ular
    mengikuti jalur kepala.
*/

let playerHistory = [];

let enemyHistory = [];


/* =====================================================
   PLAYER
===================================================== */

let playerX =
    window.innerWidth * .52;

let playerY =
    window.innerHeight * .55;

let playerAngle = 0;


/* =====================================================
   ENEMY
===================================================== */

let enemyX =
    window.innerWidth * .70;

let enemyY =
    window.innerHeight * .52;

let enemyAngle = 0;


/* =====================================================
   GAME
===================================================== */

let hp = 100;

let enemyHP = 100;

let score = 0;

let diamonds = 2;

let playing = false;

let paused = false;

let attacking = false;

let hitCooldown = false;


/* =====================================================
   KEY
===================================================== */

const keys = {};


/* =====================================================
   CREATE SNAKE
===================================================== */

function createSnake(
    container,
    type,
    isPlayer
){

    container.innerHTML = "";


    /*
       BODY
    */

    for(
        let i = 0;
        i < SEGMENTS;
        i++
    ){

        const segment =
            document.createElement(
                "div"
            );

        segment.className =
            "segment " +
            type +
            "-segment";


        segment.dataset.index =
            i;


        container.appendChild(
            segment
        );

    }


    /*
       HEAD
    */

    const head =
        document.createElement(
            "div"
        );

    head.className =
        "snake-head " +
        type +
        "-head";


    head.innerHTML = `

        <div class="eye left"></div>

        <div class="eye right"></div>

        <div class="snake-health">

            <div
                class="snake-health-fill"
                id="${isPlayer
                    ? "playerHealth"
                    : "enemyHealth"}">

            </div>

        </div>

    `;


    container.appendChild(
        head
    );

}


/* =====================================================
   CREATE
===================================================== */

createSnake(
    playerSnake,
    "player",
    true
);

createSnake(
    enemySnake,
    "enemy",
    false
);


/* =====================================================
   INITIAL HISTORY
===================================================== */

function initializeHistory(){

    playerHistory = [];

    enemyHistory = [];


    for(
        let i = 0;
        i < 100;
        i++
    ){

        playerHistory.push({

            x:playerX -
                i * 20,

            y:playerY

        });


        enemyHistory.push({

            x:enemyX +
                i * 20,

            y:enemyY

        });

    }

}

initializeHistory();


/* =====================================================
   DRAW SNAKE
===================================================== */

function drawSnake(
    container,
    history,
    angle
){

    const segments =
        container.querySelectorAll(
            ".segment"
        );

    const head =
        container.querySelector(
            ".snake-head"
        );


    /*
       Jarak antar badan
    */

    const spacing = 5;


    segments.forEach(
        (
            segment,
            index
        ) => {

            const historyIndex =
                Math.min(
                    index * spacing,
                    history.length - 1
                );


            const point =
                history[
                    historyIndex
                ];


            if(!point)
                return;


            segment.style.left =
                point.x + "px";

            segment.style.top =
                point.y + "px";


            /*
               badan makin kecil
            */

            const scale =
                1 -
                index * .035;


            segment.style.transform =
                `
                translate(-50%,-50%)
                scale(${scale})
                rotate(${angle}rad)
                `;

        }
    );


    /*
       HEAD
    */

    const headPoint =
        history[0];


    head.style.left =
        headPoint.x + "px";

    head.style.top =
        headPoint.y + "px";


    head.style.transform =
        `
        translate(-50%,-50%)
        rotate(${angle}rad)
        `;

}


/* =====================================================
   PARTICLE
===================================================== */

function createParticle(
    x,
    y,
    color
){

    const p =
        document.createElement(
            "div"
        );

    p.className =
        "particle";


    p.style.left =
        x + "px";

    p.style.top =
        y + "px";


    p.style.background =
        color;


    p.style.boxShadow =
        `0 0 8px ${color}`;


    p.style.setProperty(
        "--dx",
        (
            Math.random() * 50 - 25
        ) + "px"
    );


    p.style.setProperty(
        "--dy",
        (
            Math.random() * 50 - 25
        ) + "px"
    );


    game.appendChild(
        p
    );


    setTimeout(
        () => {

            p.remove();

        },
        700
    );

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            attack();

            return;

        }


        if(
            e.code === "Escape"
        ){

            pauseGame();

            return;

        }


        keys[
            e.key.toLowerCase()
        ] = true;

    }
);


document.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   CONTROLLER
===================================================== */

document
.querySelectorAll(".direction")
.forEach(
    button => {

        const key =
            button.dataset.key;


        button.addEventListener(
            "mousedown",
            () => {

                keys[key] = true;

            }
        );


        button.addEventListener(
            "mouseup",
            () => {

                keys[key] = false;

            }
        );


        button.addEventListener(
            "mouseleave",
            () => {

                keys[key] = false;

            }
        );


        button.addEventListener(
            "touchstart",
            e => {

                e.preventDefault();

                keys[key] = true;

            }
        );


        button.addEventListener(
            "touchend",
            e => {

                e.preventDefault();

                keys[key] = false;

            }
        );

    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer(){

    let moving = false;


    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        playerY -= 4.5;

        playerAngle = -Math.PI / 2;

        moving = true;

    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        playerY += 4.5;

        playerAngle = Math.PI / 2;

        moving = true;

    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        playerX -= 4.5;

        playerAngle = Math.PI;

        moving = true;

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        playerX += 4.5;

        playerAngle = 0;

        moving = true;

    }


    /*
       diagonal
    */

    if(
        (
            keys["w"] ||
            keys["arrowup"]
        )
        &&
        (
            keys["d"] ||
            keys["arrowright"]
        )
    ){

        playerAngle =
            -Math.PI / 4;

    }


    if(
        (
            keys["w"] ||
            keys["arrowup"]
        )
        &&
        (
            keys["a"] ||
            keys["arrowleft"]
        )
    ){

        playerAngle =
            -3 * Math.PI / 4;

    }


    if(
        (
            keys["s"] ||
            keys["arrowdown"]
        )
        &&
        (
            keys["d"] ||
            keys["arrowright"]
        )
    ){

        playerAngle =
            Math.PI / 4;

    }


    if(
        (
            keys["s"] ||
            keys["arrowdown"]
        )
        &&
        (
            keys["a"] ||
            keys["arrowleft"]
        )
    ){

        playerAngle =
            3 * Math.PI / 4;

    }


    /*
       batas arena
    */

    playerX =
        Math.max(
            80,
            Math.min(
                window.innerWidth - 100,
                playerX
            )
        );


    playerY =
        Math.max(
            180,
            Math.min(
                window.innerHeight - 120,
                playerY
            )
        );


    /*
       masukkan posisi
       kepala ke history
    */

    playerHistory.unshift({

        x:playerX,

        y:playerY

    });


    playerHistory =
        playerHistory.slice(
            0,
            100
        );


    /*
       particle trail
    */

    if(moving){

        const tail =
            playerHistory[
                SEGMENTS * 5
            ];

        if(
            tail &&
            Math.random() < .35
        ){

            createParticle(
                tail.x,
                tail.y,
                "#ff3f68"
            );

        }

    }

}


/* =====================================================
   ENEMY AI
===================================================== */

function moveEnemy(){

    const dx =
        playerX -
        enemyX;

    const dy =
        playerY -
        enemyY;


    const dist =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(dist > 100){

        enemyX +=
            (dx / dist) *
            1.6;

        enemyY +=
            (dy / dist) *
            1.6;


        enemyAngle =
            Math.atan2(
                dy,
                dx
            );

    }


    enemyX =
        Math.max(
            100,
            Math.min(
                window.innerWidth - 100,
                enemyX
            )
        );


    enemyY =
        Math.max(
            190,
            Math.min(
                window.innerHeight - 120,
                enemyY
            )
        );


    enemyHistory.unshift({

        x:enemyX,

        y:enemyY

    });


    enemyHistory =
        enemyHistory.slice(
            0,
            100
        );


    const tail =
        enemyHistory[
            SEGMENTS * 5
        ];


    if(
        tail &&
        Math.random() < .3
    ){

        createParticle(
            tail.x,
            tail.y,
            "#a94cff"
        );

    }

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(
    x1,
    y1,
    x2,
    y2
){

    return Math.sqrt(

        Math.pow(
            x1 - x2,
            2
        )

        +

        Math.pow(
            y1 - y2,
            2
        )

    );

}


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(){

    const d =
        distance(
            playerX,
            playerY,
            enemyX,
            enemyY
        );


    if(
        d < 75 &&
        !hitCooldown
    ){

        hitCooldown = true;

        hp -= 10;


        hp =
            Math.max(
                0,
                hp
            );


        hpText.textContent =
            hp;


        hpFill.style.width =
            hp + "%";


        showDamage(
            playerX,
            playerY,
            "-10"
        );


        showSubtitle(
            "💔 Kamu terkena serangan!"
        );


        if(hp <= 30){

            hpFill.style.background =
                "linear-gradient(90deg,#ff3e68,#ff7755)";

        }


        if(hp <= 0){

            gameOver();

            return;

        }


        setTimeout(
            () => {

                hitCooldown = false;

            },
            700
        );

    }

}


/* =====================================================
   ATTACK
===================================================== */

function attack(){

    if(
        !playing ||
        paused ||
        attacking
    )
        return;


    attacking = true;


    attackRing.style.left =
        playerX + "px";

    attackRing.style.top =
        playerY + "px";


    attackRing.classList.remove(
        "active"
    );


    void attackRing.offsetWidth;


    attackRing.classList.add(
        "active"
    );


    const d =
        distance(
            playerX,
            playerY,
            enemyX,
            enemyY
        );


    if(d < 170){

        enemyHP -= 25;


        enemyHP =
            Math.max(
                0,
                enemyHP
            );


        document
        .getElementById(
            "enemyHealth"
        )
        .style.width =
            enemyHP + "%";


        showDamage(
            enemyX,
            enemyY,
            "-25"
        );


        showSubtitle(
            "⚔ MUSUH TERKENA!"
        );


        if(enemyHP <= 0){

            killEnemy();

        }

    }
    else{

        showSubtitle(
            "⚔ SERANGAN!"
        );

    }


    setTimeout(
        () => {

            attacking = false;

        },
        300
    );

}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(){

    score += 10;

    scoreText.textContent =
        score;


    diamonds++;

    diamondText.textContent =
        diamonds;


    showSubtitle(
        "💥 MUSUH KALAH! +10 SCORE"
    );


    enemySnake.style.opacity =
        "0";


    setTimeout(
        () => {

            enemyX =
                500 +
                Math.random() *
                (
                    window.innerWidth - 700
                );


            enemyY =
                250 +
                Math.random() *
                (
                    window.innerHeight - 450
                );


            enemyHP = 100;


            enemyHistory = [];


            for(
                let i=0;
                i<100;
                i++
            ){

                enemyHistory.push({

                    x:
                        enemyX +
                        i * 20,

                    y:
                        enemyY

                });

            }


            document
            .getElementById(
                "enemyHealth"
            )
            .style.width =
                "100%";


            enemySnake.style.opacity =
                "1";

        },
        1200
    );

}


/* =====================================================
   DAMAGE NUMBER
===================================================== */

function showDamage(
    x,
    y,
    text
){

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "damage-number";


    element.textContent =
        text;


    element.style.left =
        x + "px";


    element.style.top =
        y + "px";


    game.appendChild(
        element
    );


    setTimeout(
        () => {

            element.remove();

        },
        800
    );

}


/* =====================================================
   SUBTITLE
===================================================== */

function showSubtitle(text){

    subtitle.textContent =
        text;


    subtitle.classList.add(
        "show"
    );


    setTimeout(
        () => {

            subtitle.classList.remove(
                "show"
            );

        },
        1400
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    if(
        playing &&
        !paused
    ){

        movePlayer();

        moveEnemy();

        checkCollision();


        drawSnake(
            playerSnake,
            playerHistory,
            playerAngle
        );


        drawSnake(
            enemySnake,
            enemyHistory,
            enemyAngle
        );

    }


    requestAnimationFrame(
        loop
    );

}

loop();


/* =====================================================
   START
===================================================== */

function startGame(){

    document
    .getElementById(
        "startModal"
    )
    .classList.remove(
        "show"
    );


    playing = true;

    paused = false;


    showSubtitle(
        "🐍 PERTEMPURAN DIMULAI!"
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    playing = false;


    document
    .getElementById(
        "finalScore"
    )
    .textContent =
        score;


    document
    .getElementById(
        "gameOver"
    )
    .classList.add(
        "show"
    );

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

    document
    .getElementById(
        "gameOver"
    )
    .classList.remove(
        "show"
    );


    hp = 100;

    enemyHP = 100;

    score = 0;

    diamonds = 2;


    hpText.textContent =
        hp;


    hpFill.style.width =
        "100%";


    hpFill.style.background =
        "linear-gradient(90deg,#20d9bd,#2cc8ed)";


    scoreText.textContent =
        score;


    diamondText.textContent =
        diamonds;


    playerX =
        window.innerWidth * .52;

    playerY =
        window.innerHeight * .55;


    enemyX =
        window.innerWidth * .70;

    enemyY =
        window.innerHeight * .52;


    initializeHistory();


    enemySnake.style.opacity =
        "1";


    document
    .getElementById(
        "enemyHealth"
    )
    .style.width =
        "100%";


    playing = true;

}


/* =====================================================
   PAUSE
===================================================== */

function pauseGame(){

    if(!playing)
        return;


    paused = true;


    document
    .getElementById(
        "pauseModal"
    )
    .classList.add(
        "show"
    );

}


function resumeGame(){

    paused = false;


    document
    .getElementById(
        "pauseModal"
    )
    .classList.remove(
        "show"
    );

}

   MENU
===================================================== */

/* =====================================================
   INITIAL DRAW
===================================================== */

drawSnake(
    playerSnake,
    playerHistory,
    playerAngle
);


drawSnake(
    enemySnake,
    enemyHistory,
    enemyAngle
);

</script>
