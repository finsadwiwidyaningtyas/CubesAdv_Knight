<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CubesAdv Knight — SMKN 1 Sanden</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color:#ecfaff;
    background:#020611;
}


/* =========================================================
   GAME BACKGROUND
========================================================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0,170,255,.20),
            transparent 34%
        ),
        radial-gradient(
            circle at 82% 15%,
            rgba(159,52,255,.22),
            transparent 28%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(0,255,207,.08),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #041a35 0%,
            #020b1c 55%,
            #01040d 100%
        );
}


/* GRID */

#game::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(49,202,255,.10) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(49,202,255,.10) 1px,
            transparent 1px
        );

    background-size:48px 48px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            rgba(0,0,0,.25)
        );
}


/* STARS */

#game::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.7) 1px,
            transparent 1.5px
        );

    background-size:
        91px 83px;

    opacity:.22;
    pointer-events:none;
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.light{
    position:absolute;
    width:420px;
    height:420px;

    border-radius:50%;

    filter:blur(70px);
    opacity:.14;

    pointer-events:none;
}

.light.one{
    left:20%;
    top:25%;
    background:#00cfff;
}

.light.two{
    right:8%;
    top:15%;
    background:#9c3cff;
}

.light.three{
    left:45%;
    bottom:-180px;
    background:#00ffc8;
}


/* =========================================================
   HUD BASE
========================================================= */

.hud{
    position:absolute;
    z-index:30;

    background:
        linear-gradient(
            145deg,
            rgba(8,31,58,.92),
            rgba(2,12,28,.88)
        );

    border:
        1px solid rgba(61,221,255,.35);

    border-radius:20px;

    box-shadow:
        0 0 30px rgba(0,179,255,.08),
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 0 30px rgba(0,183,255,.025);

    backdrop-filter:blur(14px);
}


/* =========================================================
   BRAND
========================================================= */

.brand{
    left:20px;
    top:20px;

    width:320px;
    min-height:76px;

    padding:15px 18px;

    display:flex;
    align-items:center;
    gap:14px;
}


/* ICON */

.brand-icon{
    width:52px;
    height:52px;

    flex:none;

    display:grid;
    place-items:center;

    border-radius:15px;

    font-size:27px;

    background:
        linear-gradient(
            145deg,
            #12bfff,
            #0756d9
        );

    border:1px solid #68edff;

    box-shadow:
        0 0 18px rgba(0,190,255,.5),
        inset 0 2px 7px rgba(255,255,255,.45),
        inset 0 -7px 15px rgba(0,0,0,.25);

    transform:rotate(-3deg);
}


/* TITLE */

.brand-title{
    font-size:19px;
    font-weight:950;
    letter-spacing:-.3px;
}

.brand-title b{
    color:#48eaff;

    text-shadow:
        0 0 12px rgba(72,234,255,.4);
}

.sub{
    margin-top:5px;

    font-size:10px;
    font-weight:700;

    letter-spacing:2px;

    color:#83a9c3;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    left:20px;
    top:110px;

    width:320px;

    padding:17px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:16px;
    font-weight:900;
}

.hp-number{
    color:#ffffff;
}


/* HP BAR */

.hpbar{
    position:relative;

    height:17px;

    margin-top:11px;

    overflow:hidden;

    border-radius:999px;

    background:#091d35;

    border:1px solid rgba(90,220,255,.12);

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.5);
}

.fill{
    position:relative;

    width:76%;
    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #14e5bf,
            #26d9ff,
            #5ee8ff
        );

    box-shadow:
        0 0 14px #21dfff,
        inset 0 2px 5px rgba(255,255,255,.5);

    transition:
        width .25s ease;
}

.fill::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.5),
            transparent
        );

    animation:
        hpshine 2s linear infinite;
}

@keyframes hpshine{

    from{
        transform:translateX(-100%);
    }

    to{
        transform:translateX(100%);
    }

}


/* SCORE */

.score{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:11px;

    font-size:13px;
    font-weight:800;

    color:#9dbbd0;
}

.score b{
    color:#ffd84d;
    font-size:15px;
}

.gem-score{
    color:#53eaff !important;
}


/* =========================================================
   ONLINE
========================================================= */

.online{
    right:20px;
    top:20px;

    padding:11px 17px;

    font-size:14px;
    font-weight:950;
}

.online-dot{
    display:inline-block;

    width:10px;
    height:10px;

    margin-right:8px;

    border-radius:50%;

    background:#36f5bd;

    box-shadow:
        0 0 12px #36f5bd;

    animation:
        onlinePulse 1.6s infinite;
}

@keyframes onlinePulse{

    50%{
        transform:scale(1.35);
        opacity:.65;
    }

}


/* =========================================================
   MINIMAP
========================================================= */

.map{
    right:20px;
    top:78px;

    width:310px;
    height:215px;

    padding:10px;
}

.mapin{
    position:absolute;
    inset:10px;

    overflow:hidden;

    border:
        1px solid rgba(60,222,255,.38);

    border-radius:17px;

    background:
        linear-gradient(
            rgba(30,190,255,.06),
            rgba(30,190,255,.02)
        );

    box-shadow:
        inset 0 0 25px rgba(0,180,255,.08);
}

.mapin::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(55,209,255,.13) 2px,
            transparent 2px
        ),
        linear-gradient(
            90deg,
            rgba(55,209,255,.13) 2px,
            transparent 2px
        );

    background-size:35px 35px;
}


/* MAP DOTS */

.dot{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    z-index:2;

    box-shadow:
        0 0 13px currentColor;
}

.dot.a{
    left:18%;
    top:68%;
    background:#36f5bd;
    color:#36f5bd;
}

.dot.b{
    left:72%;
    top:22%;
    background:#ff3f6c;
    color:#ff3f6c;
}

.dot.c{
    left:66%;
    top:58%;
    background:#ffd42f;
    color:#ffd42f;
}

.dot.d{
    left:58%;
    top:48%;

    width:16px;
    height:16px;

    background:#4deaff;
    color:#4deaff;

    animation:
        mapPulse 1.4s infinite;
}

.dot.e{
    left:61%;
    top:45%;
    background:#ff4f9a;
    color:#ff4f9a;
}

.dot.f{
    left:78%;
    top:76%;
    background:#a65cff;
    color:#a65cff;
}

@keyframes mapPulse{

    50%{
        transform:scale(1.35);
    }

}


/* =========================================================
   NAVIGATION
========================================================= */

.nav{
    position:absolute;

    right:20px;
    top:310px;

    z-index:35;

    display:flex;
    gap:9px;

    flex-wrap:wrap;
    justify-content:flex-end;

    max-width:900px;
}

.nav button{
    min-width:102px;

    padding:11px 15px;

    border-radius:15px;

    border:
        1px solid rgba(55,218,255,.38);

    background:
        linear-gradient(
            145deg,
            rgba(7,35,61,.95),
            rgba(2,15,32,.94)
        );

    color:#e9f8ff;

    font-weight:950;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06);

    transition:
        .18s ease;
}

.nav button:hover{
    transform:translateY(-3px);

    border-color:#4eeaff;

    box-shadow:
        0 0 20px rgba(23,207,255,.25),
        inset 0 0 15px rgba(23,207,255,.08);
}

.nav button:active{
    transform:
        translateY(1px)
        scale(.97);
}


/* =========================================================
   ARENA
========================================================= */

.arena{
    position:absolute;
    inset:0;
}


/* =========================================================
   PLAYER
========================================================= */

.player{
    position:absolute;

    left:48%;
    top:54%;

    width:66px;
    height:66px;

    transform:
        translate(-50%,-50%);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #38c5ff 0%,
            #1488ff 45%,
            #0754cf 100%
        );

    border:
        2px solid #68edff;

    box-shadow:
        0 0 18px #139fff,
        0 0 55px rgba(0,167,255,.35),
        inset 0 4px 10px rgba(255,255,255,.35),
        inset 0 -12px 18px rgba(0,0,80,.25);

    z-index:10;

    transition:
        left .06s linear,
        top .06s linear;
}


/* PLAYER 3D SHINE */

.player::after{
    content:"";

    position:absolute;

    left:7px;
    top:6px;

    width:25px;
    height:13px;

    border-radius:50%;

    background:
        rgba(255,255,255,.38);

    filter:blur(2px);

    transform:rotate(-25deg);
}


/* PLAYER SYMBOL */

.player::before{
    content:"◆";

    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    color:#efffff;

    font-size:31px;

    text-shadow:
        0 2px 4px rgba(0,50,100,.6);
}


/* VISOR */

.visor{
    position:absolute;

    z-index:3;

    left:17px;
    top:14px;

    width:31px;
    height:10px;

    border-radius:4px;

    background:
        linear-gradient(
            90deg,
            #d9ffff,
            #6defff
        );

    border:
        2px solid #086994;

    box-shadow:
        0 0 8px rgba(107,242,255,.6);
}


/* PLAYER BEAM */

.beam{
    position:absolute;

    bottom:100%;
    left:50%;

    width:24px;
    height:150px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            transparent,
            rgba(38,192,255,.22)
        );

    filter:blur(5px);

    pointer-events:none;
}


/* =========================================================
   PLAYER SHADOW
========================================================= */

.player-shadow{
    position:absolute;

    left:48%;
    top:calc(54% + 36px);

    width:70px;
    height:18px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:rgba(0,0,0,.55);

    filter:blur(8px);

    z-index:4;

    transition:
        left .06s linear,
        top .06s linear;
}


/* =========================================================
   ENEMY
========================================================= */

.enemy{
    position:absolute;

    width:54px;
    height:54px;

    transform:
        translate(-50%,-50%);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #d36cff,
            #883cff 50%,
            #5620c7
        );

    border:
        2px solid #e2b1ff;

    box-shadow:
        0 0 20px #9d5cff,
        0 0 45px rgba(154,74,255,.32),
        inset 0 4px 10px rgba(255,255,255,.25),
        inset 0 -10px 15px rgba(40,0,90,.25);

    z-index:7;

    animation:
        enemyFloat 2.4s ease-in-out infinite;
}

.enemy:nth-child(2){
    animation-delay:.7s;
}

.enemy span{
    position:absolute;

    bottom:100%;
    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    margin-bottom:9px;

    font-size:12px;
    font-weight:950;

    color:#f6eaff;

    text-shadow:
        0 2px 8px #000;
}

.enemy::after{
    content:"";

    position:absolute;
    inset:11px;

    border:
        2px solid rgba(255,255,255,.55);

    border-radius:8px;

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.12);
}

@keyframes enemyFloat{

    50%{
        transform:
            translate(-50%,-55%);
    }

}


/* =========================================================
   3D GEMS
========================================================= */

.gem{
    position:absolute;

    width:42px;
    height:42px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #b9ffff 0%,
            #35efff 18%,
            #1da5ff 48%,
            #1757dd 100%
        );

    border:
        2px solid rgba(205,255,255,.95);

    box-shadow:
        0 0 12px #21eaff,
        0 0 30px rgba(25,215,255,.75),
        0 0 65px rgba(31,119,255,.38),
        inset 4px 4px 7px rgba(255,255,255,.65),
        inset -7px -8px 12px rgba(0,45,180,.45);

    z-index:6;

    animation:
        gemFloat 1.8s ease-in-out infinite;
}


/* GEM INNER */

.gem::before{
    content:"";

    position:absolute;

    inset:7px;

    border-radius:7px;

    border:
        2px solid rgba(230,255,255,.82);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.35),
            rgba(0,100,255,.08)
        );

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.3);
}


/* GEM HIGHLIGHT */

.gem::after{
    content:"";

    position:absolute;

    width:12px;
    height:7px;

    left:6px;
    top:6px;

    border-radius:50%;

    background:
        rgba(255,255,255,.85);

    filter:blur(1px);

    transform:
        rotate(-20deg);
}


/* SECOND GEM STYLE */

.gem.pink{
    background:
        linear-gradient(
            135deg,
            #fff0ff,
            #ff65d9 22%,
            #bd37ff 55%,
            #6324d9
        );

    border-color:#ffd8ff;

    box-shadow:
        0 0 14px #ff53db,
        0 0 34px rgba(255,55,210,.65),
        0 0 65px rgba(150,35,255,.35),
        inset 4px 4px 7px rgba(255,255,255,.65),
        inset -7px -8px 12px rgba(82,0,150,.45);
}

@keyframes gemFloat{

    0%,
    100%{
        margin-top:0;
        filter:brightness(1);
    }

    50%{
        margin-top:-9px;
        filter:brightness(1.25);
    }

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
    position:absolute;

    left:28px;
    bottom:27px;

    z-index:40;

    display:grid;

    grid-template:
        70px
        70px
        /
        70px 70px 70px;

    gap:8px;
}

.ctrl{
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(8,39,68,.96),
            rgba(2,17,34,.96)
        );

    border:
        1px solid rgba(50,218,255,.55);

    color:#effcff;

    display:grid;
    place-items:center;

    font-size:30px;
    font-weight:950;

    cursor:pointer;

    box-shadow:
        inset 0 2px 7px rgba(255,255,255,.06),
        0 0 15px rgba(0,160,255,.08);

    touch-action:none;

    transition:
        .12s ease;
}

.ctrl:hover{
    transform:
        translateY(-2px);

    border-color:#65eaff;

    box-shadow:
        0 0 22px rgba(28,215,255,.25);
}

.ctrl:active{
    transform:
        scale(.91);
}

.up{
    grid-column:2;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}


/* =========================================================
   ATTACK BUTTON
========================================================= */

.attack{
    position:absolute;

    right:30px;
    bottom:27px;

    width:315px;
    height:82px;

    border:0;
    border-radius:24px;

    z-index:40;

    color:#fff;

    font-size:20px;
    font-weight:950;

    cursor:pointer;

    background:
        linear-gradient(
            110deg,
            #e92778,
            #bc28c7,
            #7f35ed
        );

    box-shadow:
        0 0 28px rgba(235,40,145,.42),
        0 0 60px rgba(160,50,230,.15),
        inset 0 2px 10px rgba(255,255,255,.28),
        inset 0 -9px 16px rgba(80,0,100,.22);

    transition:
        .16s ease;

    overflow:hidden;
}

.attack::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.22) 50%,
            transparent 80%
        );

    transform:
        translateX(-100%);

    transition:
        .5s ease;
}

.attack:hover::before{
    transform:
        translateX(100%);
}

.attack:hover{
    transform:
        translateY(-4px);

    box-shadow:
        0 0 40px rgba(235,40,145,.6),
        0 0 80px rgba(160,50,230,.2),
        inset 0 2px 12px rgba(255,255,255,.3);
}

.attack:active{
    transform:
        scale(.95);
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:absolute;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        scale(.8);

    opacity:0;

    z-index:100;

    padding:15px 24px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(7,28,52,.98),
            rgba(2,10,24,.98)
        );

    border:
        1px solid #55eaff;

    font-weight:950;

    box-shadow:
        0 0 35px rgba(0,210,255,.22);

    pointer-events:none;

    transition:
        .2s ease;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   MODAL PAUSE
========================================================= */

.modal{
    display:none;

    place-items:center;

    position:absolute;
    inset:0;

    z-index:90;

    background:
        rgba(0,3,12,.72);

    backdrop-filter:
        blur(12px);
}

.card{
    width:min(460px,90vw);

    padding:32px;

    text-align:center;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(8,31,58,.98),
            rgba(2,12,27,.98)
        );

    border:
        1px solid rgba(69,228,255,.5);

    box-shadow:
        0 0 60px rgba(0,200,255,.15),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.card-icon{
    font-size:48px;

    margin-bottom:12px;

    filter:
        drop-shadow(0 0 15px #36ddff);
}

.card h2{
    font-size:27px;

    margin-bottom:10px;
}

.card p{
    color:#91aec2;

    line-height:1.7;

    font-size:14px;
}

.card button{
    margin-top:20px;

    padding:13px 27px;

    border-radius:14px;

    border:
        1px solid #69eaff;

    background:
        linear-gradient(
            145deg,
            #119bff,
            #1465e9
        );

    color:white;

    font-weight:950;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(0,180,255,.25);
}


/* =========================================================
   DAMAGE FLASH
========================================================= */

.damage{
    animation:
        damageFlash .3s;
}

@keyframes damageFlash{

    25%{
        filter:
            brightness(1.8)
            saturate(2);
    }

    100%{
        filter:none;
    }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

.accessibility{
    position:absolute;

    left:50%;
    top:20px;

    transform:
        translateX(-50%);

    z-index:35;

    padding:8px 12px;

    border-radius:12px;

    background:
        rgba(3,20,40,.72);

    border:
        1px solid rgba(75,220,255,.2);

    color:#7fa7bd;

    font-size:10px;

    letter-spacing:1px;

    pointer-events:none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .brand,
    .stats{
        width:250px;
    }

    .map{
        width:250px;
        height:170px;
    }

    .nav{
        top:auto;
        bottom:120px;
        max-width:55vw;
    }

    .nav button{
        min-width:auto;
        padding:9px 11px;
        font-size:12px;
    }

    .attack{
        width:250px;
        height:72px;
        font-size:17px;
    }

}


@media(max-width:700px){

    .brand{
        left:10px;
        top:10px;

        width:auto;

        padding:8px 10px;
    }

    .brand-icon{
        width:43px;
        height:43px;

        font-size:22px;
    }

    .brand-title{
        font-size:15px;
    }

    .sub{
        display:none;
    }


    .stats{
        left:10px;
        top:70px;

        width:205px;

        padding:11px;
    }

    .row{
        font-size:13px;
    }

    .score{
        font-size:11px;
    }


    .online{
        right:10px;
        top:10px;

        font-size:11px;
        padding:8px 11px;
    }


    .map{
        right:10px;
        top:55px;

        width:155px;
        height:110px;
    }

    .mapin{
        inset:7px;
    }


    .nav{
        display:none;
    }

    .accessibility{
        display:none;
    }


    .controls{
        left:10px;
        bottom:12px;

        grid-template:
            58px
            58px
            /
            58px 58px 58px;

        gap:6px;
    }

    .ctrl{
        font-size:25px;
        border-radius:15px;
    }


    .attack{
        right:10px;
        bottom:14px;

        width:190px;
        height:62px;

        font-size:14px;

        border-radius:19px;
    }


    .player{
        width:55px;
        height:55px;
    }

    .gem{
        width:35px;
        height:35px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition:none !important;
    }

}

</style>
</head>


<body>

<div id="game">

    <!-- AMBIENT LIGHT -->

    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>


    <!-- =====================================================
         BRAND
    ====================================================== -->

    <div class="hud brand">

        <div class="brand-icon">
            ⚔️
        </div>

        <div>

            <div class="brand-title">
                <b>CubesAdv</b> Knight
            </div>

            <div class="sub">
                SMKN 1 SANDEN • BANTUL
            </div>

        </div>

    </div>


    <!-- =====================================================
         STATS
    ====================================================== -->

    <div class="hud stats">

        <div class="row">

            <span>
                💗 HP
            </span>

            <span
                id="hp"
                class="hp-number"
            >
                76/100
            </span>

        </div>


        <div class="hpbar">

            <div
                id="fill"
                class="fill"
            ></div>

        </div>


        <div class="score">

            <span>
                🏆 SCORE
            </span>

            <b id="score">
                0
            </b>

            <span>
                •
            </span>

            <span>
                💎
            </span>

            <b
                id="gems"
                class="gem-score"
            >
                0
            </b>

        </div>

    </div>


    <!-- =====================================================
         ONLINE
    ====================================================== -->

    <div class="hud online">

        <span class="online-dot"></span>

        ONLINE

        <span id="online">
            4
        </span>

    </div>


    <!-- =====================================================
         MINIMAP
    ====================================================== -->

    <div class="hud map">

        <div class="mapin">

            <i class="dot a"></i>
            <i class="dot b"></i>
            <i class="dot c"></i>
            <i class="dot d"></i>
            <i class="dot e"></i>
            <i class="dot f"></i>

        </div>

    </div>


    <!-- =====================================================
         ACCESSIBILITY
    ====================================================== -->

    <div class="accessibility">

        KEYBOARD • WASD / ARROW • SPACE • P

    </div>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <div class="nav">

        <button
            onclick="toast('🏠 Lobby siap')"
        >
            🏠 Lobby
        </button>


        <button
            onclick="showPlayers()"
        >
            👥 Players
        </button>


        <button
            onclick="toast('💬 Chat siap digunakan')"
        >
            💬 Chat
        </button>


        <button
            onclick="toast('🏆 Rank kamu: KNIGHT')"
        >
            🏆 Rank
        </button>


        <button
            onclick="toast('🎯 Match ditemukan!')"
        >
            🎯 Match
        </button>


        <button
            onclick="pause()"
        >
            Ⅱ Pause
        </button>

    </div>


    <!-- =====================================================
         ARENA
    ====================================================== -->

    <div class="arena">


        <!-- PLAYER SHADOW -->

        <div
            id="playerShadow"
            class="player-shadow"
        ></div>


        <!-- PLAYER -->

        <div
            id="player"
            class="player"
        >

            <span class="beam"></span>

            <span class="visor"></span>

        </div>


        <!-- ENEMY 1 -->

        <div
            class="enemy"
            style="
                left:39%;
                top:81%;
            "
        >

            <span>
                ShadowFox
            </span>

        </div>


        <!-- ENEMY 2 -->

        <div
            class="enemy"
            style="
                left:74%;
                top:66%;
                transform:
                    translate(-50%,-50%)
                    scale(.82);
            "
        >

            <span>
                CrystalFox
            </span>

        </div>


        <!-- =================================================
             GEM 1
        ================================================== -->

        <div
            class="gem"
            style="
                left:63%;
                top:28%;
            "
            onclick="collectGem(this)"
        ></div>


        <!-- =================================================
             GEM 2
        ================================================== -->

        <div
            class="gem pink"
            style="
                left:27%;
                top:38%;
            "
            onclick="collectGem(this)"
        ></div>


    </div>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <div class="controls">

        <button
            class="ctrl up"
            data-k="ArrowUp"
            aria-label="Gerak atas"
        >
            ▲
        </button>


        <button
            class="ctrl left"
            data-k="ArrowLeft"
            aria-label="Gerak kiri"
        >
            ◀
        </button>


        <button
            class="ctrl down"
            data-k="ArrowDown"
            aria-label="Gerak bawah"
        >
            ▼
        </button>


        <button
            class="ctrl right"
            data-k="ArrowRight"
            aria-label="Gerak kanan"
        >
            ▶
        </button>

    </div>


    <!-- =====================================================
         ATTACK
    ====================================================== -->

    <button
        class="attack"
        onclick="attack()"
    >
        ⚔️ SERANG [ SPACE ]
    </button>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- =====================================================
         PAUSE MODAL
    ====================================================== -->

    <div
        id="modal"
        class="modal"
    >

        <div class="card">

            <div class="card-icon">
                ⏸️
            </div>

            <h2>
                GAME PAUSED
            </h2>

            <p>
                Istirahat sebentar, Knight.
                Arena akan tetap menunggumu.
            </p>

            <button
                onclick="pause()"
            >
                ▶ LANJUTKAN
            </button>

        </div>

    </div>


</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const player =
    document.getElementById("player");

const playerShadow =
    document.getElementById("playerShadow");

const hpEl =
    document.getElementById("hp");

const fill =
    document.getElementById("fill");

const scoreEl =
    document.getElementById("score");

const gemsEl =
    document.getElementById("gems");

const toastEl =
    document.getElementById("toast");

const modal =
    document.getElementById("modal");

const game =
    document.getElementById("game");


/* =========================================================
   VARIABLES
========================================================= */

let x = 48;
let y = 54;

let hp = 76;
let score = 0;
let gems = 0;

let paused = false;

let keys = {};


/* =========================================================
   CLAMP
========================================================= */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    player.style.left =
        x + "%";

    player.style.top =
        y + "%";


    playerShadow.style.left =
        x + "%";

    playerShadow.style.top =
        `calc(${y}% + 36px)`;


    hpEl.textContent =
        hp + "/100";


    fill.style.width =
        hp + "%";


    scoreEl.textContent =
        score;


    gemsEl.textContent =
        gems;

}


/* =========================================================
   MOVE
========================================================= */

function move(dx,dy){

    if(paused || hp <= 0){

        return;

    }


    x =
        clamp(
            x + dx,
            5,
            95
        );


    y =
        clamp(
            y + dy,
            16,
            90
        );


    render();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    toastEl.textContent =
        message;


    toastEl.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toastEl.classList.remove(
                    "show"
                );

            },
            1000
        );

}


/* =========================================================
   COLLECT GEM
========================================================= */

function collectGem(element){

    if(paused || hp <= 0){

        return;

    }


    gems++;

    score += 25;


    element.style.pointerEvents =
        "none";


    element.style.transition =
        ".35s ease";


    element.style.transform =
        "translate(-50%,-50%) rotate(45deg) scale(1.7)";


    element.style.opacity =
        "0";


    toast(
        "💎 +1 GEM! +25 SCORE"
    );


    setTimeout(
        function(){

            element.remove();

        },
        400
    );


    render();

}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

    if(
        paused ||
        hp <= 0
    ){

        return;

    }


    score += 10;


    player.classList.add(
        "damage"
    );


    setTimeout(
        function(){

            player.classList.remove(
                "damage"
            );

        },
        300
    );


    if(
        Math.random() < .35
    ){

        gems++;

        toast(
            "⚔️ SERANG! +10 SCORE • 💎 +1 GEM"
        );

    }
    else{

        toast(
            "⚔️ SERANG! +10 SCORE"
        );

    }


    /* DAMAGE CHANCE */

    if(
        Math.random() < .22
    ){

        hp =
            Math.max(
                0,
                hp - 3
            );


        toast(
            "💥 -3 HP"
        );

    }


    render();


    if(hp <= 0){

        toast(
            "☠️ KALAH — tekan R untuk reset"
        );

    }

}


/* =========================================================
   PLAYERS
========================================================= */

function showPlayers(){

    toast(
        "👥 4 PLAYERS ONLINE"
    );

}


/* =========================================================
   PAUSE
========================================================= */

function pause(){

    paused =
        !paused;


    modal.style.display =
        paused
            ? "grid"
            : "none";

}


/* =========================================================
   KEY DOWN
========================================================= */

window.addEventListener(
    "keydown",
    function(event){

        keys[event.key] =
            true;


        if(
            event.code === "Space"
        ){

            event.preventDefault();

            attack();

        }


        if(
            event.key.toLowerCase()
            === "p"
        ){

            pause();

        }


        if(
            event.key.toLowerCase()
            === "r" &&
            hp <= 0
        ){

            resetGame();

        }

    }
);


/* =========================================================
   KEY UP
========================================================= */

window.addEventListener(
    "keyup",
    function(event){

        keys[event.key] =
            false;

    }
);


/* =========================================================
   MOVEMENT LOOP
========================================================= */

setInterval(
    function(){

        if(
            paused ||
            hp <= 0
        ){

            return;

        }


        let dx = 0;
        let dy = 0;


        if(
            keys.ArrowLeft ||
            keys.a ||
            keys.A
        ){

            dx -= .75;

        }


        if(
            keys.ArrowRight ||
            keys.d ||
            keys.D
        ){

            dx += .75;

        }


        if(
            keys.ArrowUp ||
            keys.w ||
            keys.W
        ){

            dy -= .75;

        }


        if(
            keys.ArrowDown ||
            keys.s ||
            keys.S
        ){

            dy += .75;

        }


        if(
            dx !== 0 ||
            dy !== 0
        ){

            move(dx,dy);

        }

    },
    30
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
    .querySelectorAll(".ctrl")
    .forEach(
        function(button){

            button.addEventListener(
                "pointerdown",
                function(event){

                    event.preventDefault();


                    const key =
                        button.dataset.k;


                    if(
                        key === "ArrowLeft"
                    ){

                        move(-2.2,0);

                    }


                    if(
                        key === "ArrowRight"
                    ){

                        move(2.2,0);

                    }


                    if(
                        key === "ArrowUp"
                    ){

                        move(0,-2.2);

                    }


                    if(
                        key === "ArrowDown"
                    ){

                        move(0,2.2);

                    }

                }
            );

        }
    );


/* =========================================================
   SCORE TIMER
========================================================= */

setInterval(
    function(){

        if(
            !paused &&
            hp > 0
        ){

            score++;

            render();

        }

    },
    1500
);


/* =========================================================
   RESET GAME
========================================================= */

function resetGame(){

    hp = 76;

    score = 0;

    gems = 0;

    x = 48;

    y = 54;

    paused = false;

    modal.style.display =
        "none";


    render();


    toast(
        "🔄 GAME RESET!"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

render();

</script>

</body>
</html>
