<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CubesAdv_Knight ⚔️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#020b19;
    --panel:rgba(3,18,39,.82);
    --line:#1684a8;
    --cyan:#54e7ff;
    --blue:#249cff;
    --purple:#9a62ff;
    --pink:#ff3f91;
    --red:#ff4168;
    --green:#42ffae;
    --gold:#ffd426;
    --white:#effcff;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020b19;
    color:white;
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

body{
    position:relative;
}

/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#020b19;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#031326;
    touch-action:none;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;
    top:24px;
    left:24px;
    right:24px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.leftHud{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.hudBox{
    min-width:285px;
    padding:14px 18px;
    border:1px solid rgba(84,231,255,.42);
    border-radius:16px;
    background:
        linear-gradient(
            135deg,
            rgba(3,21,43,.9),
            rgba(3,12,28,.78)
        );
    box-shadow:
        0 0 25px rgba(0,180,255,.09),
        inset 0 0 20px rgba(30,150,255,.04);
    backdrop-filter:blur(10px);
}

.hpHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.hpTitle{
    font-size:18px;
    font-weight:900;
}

.hpNumber{
    font-size:18px;
    font-weight:900;
}

.hpBar{
    width:100%;
    height:14px;
    background:#15263e;
    border:1px solid #294560;
    border-radius:30px;
    overflow:hidden;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.5);
}

#hpFill{
    height:100%;
    width:100%;
    border-radius:30px;
    background:
        linear-gradient(
            90deg,
            #22f5c2,
            #35dff4
        );
    box-shadow:
        0 0 15px #35dff4;
    transition:width .15s ease;
}

.scoreBox{
    font-weight:900;
    font-size:17px;
    min-width:auto;
    padding:11px 17px;
}

/* =========================================================
   RIGHT HUD
========================================================= */

.rightHud{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
}

.onlineBox{
    padding:10px 15px;
    border:1px solid rgba(84,231,255,.35);
    border-radius:12px;
    background:rgba(2,15,32,.82);
    font-weight:800;
    backdrop-filter:blur(8px);
}

.onlineDot{
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:6px;
    border-radius:50%;
    background:#42ffae;
    box-shadow:0 0 10px #42ffae;
}

#miniMap{
    width:220px;
    height:158px;
    border-radius:17px;
    border:1px solid rgba(84,231,255,.55);
    background:#03152b;
    box-shadow:
        0 0 25px rgba(0,190,255,.12),
        inset 0 0 20px rgba(0,0,0,.4);
}

/* =========================================================
   TOP CENTER
========================================================= */

#gameTitle{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    font-size:18px;
    font-weight:1000;
    letter-spacing:2px;
    color:#dffbff;
    text-shadow:
        0 0 10px #54e7ff,
        0 0 25px rgba(84,231,255,.5);
    pointer-events:none;
}

/* =========================================================
   TOUCH D-PAD
========================================================= */

#dpad{
    position:absolute;
    left:24px;
    bottom:26px;
    z-index:30;
    width:245px;
    height:170px;
}

.moveBtn{
    position:absolute;
    width:75px;
    height:75px;

    border-radius:20px;

    border:1px solid rgba(84,231,255,.55);

    background:
        linear-gradient(
            145deg,
            rgba(10,44,72,.9),
            rgba(4,23,46,.92)
        );

    color:white;

    font-size:30px;
    font-weight:900;

    box-shadow:
        0 0 18px rgba(0,190,255,.08),
        inset 0 0 18px rgba(50,180,255,.04);

    backdrop-filter:blur(7px);

    cursor:pointer;

    user-select:none;
    touch-action:none;

    transition:
        transform .08s,
        background .08s;
}

.moveBtn:active{
    transform:scale(.92);
    background:rgba(23,91,126,.95);
}

#up{
    left:85px;
    top:0;
}

#left{
    left:0;
    top:82px;
}

#down{
    left:85px;
    top:82px;
}

#right{
    left:170px;
    top:82px;
}

/* =========================================================
   ATTACK BUTTON
========================================================= */

#attackButton{
    position:absolute;
    right:42px;
    bottom:28px;
    z-index:30;

    min-width:290px;
    min-height:76px;

    border:none;
    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #e62f73,
            #a52ac7
        );

    color:white;

    font-size:20px;
    font-weight:1000;

    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 0 30px rgba(255,43,139,.4),
        inset 0 0 18px rgba(255,255,255,.12);

    transition:
        transform .1s,
        filter .1s;

    touch-action:none;
}

#attackButton:hover{
    filter:brightness(1.15);
    transform:translateY(-2px);
}

#attackButton:active{
    transform:scale(.94);
}

.attackCooldown{
    display:block;
    margin-top:4px;
    font-size:11px;
    opacity:.7;
}

/* =========================================================
   CENTER CROSSHAIR
========================================================= */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:.16;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#54e7ff;
}

#crosshair::before{
    width:28px;
    height:1px;
    left:0;
    top:13px;
}

#crosshair::after{
    width:1px;
    height:28px;
    left:13px;
    top:0;
}

/* =========================================================
   PAUSE BUTTON
========================================================= */

#pauseButton{
    position:absolute;
    top:210px;
    right:24px;
    z-index:30;

    border:1px solid rgba(84,231,255,.4);
    background:rgba(3,20,40,.8);

    color:white;

    border-radius:12px;
    padding:10px 14px;

    font-weight:900;

    cursor:pointer;

    backdrop-filter:blur(7px);
}

/* =========================================================
   TOAST
========================================================= */

#toast{
    position:absolute;
    left:50%;
    bottom:130px;
    transform:translate(-50%,30px);

    z-index:100;

    padding:12px 20px;

    border-radius:13px;

    border:1px solid #54e7ff;

    background:rgba(3,20,40,.95);

    box-shadow:
        0 0 25px rgba(84,231,255,.25);

    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================================================
   MODAL
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,4,14,.72);

    backdrop-filter:blur(10px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(600px,94vw);
    max-height:90vh;

    overflow:auto;

    padding:28px;

    border-radius:25px;

    border:1px solid rgba(84,231,255,.5);

    background:
        linear-gradient(
            145deg,
            rgba(6,31,58,.98),
            rgba(9,8,34,.98)
        );

    box-shadow:
        0 0 60px rgba(30,160,255,.2);
}

.modal h2{
    margin-bottom:18px;

    font-size:29px;

    color:white;

    text-shadow:
        0 0 16px rgba(84,231,255,.5);
}

.modal p{
    color:#b8cedc;
    line-height:1.65;
    margin-bottom:15px;
}

.modalButtons{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
}

.bigBtn{
    width:100%;

    border:none;
    border-radius:13px;

    padding:14px;

    color:white;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #0d83be,
            #6946db
        );
}

.bigBtn.secondary{
    background:#0c2947;
}

.bigBtn.danger{
    background:
        linear-gradient(
            90deg,
            #a82254,
            #611b40
        );
}

/* =========================================================
   PLAYER LIST
========================================================= */

.playerList{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin:15px 0;
}

.playerRow{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px;

    border-radius:11px;

    border:1px solid rgba(84,231,255,.15);

    background:rgba(255,255,255,.035);
}

.dot{
    width:9px;
    height:9px;

    display:inline-block;

    border-radius:50%;

    margin-right:7px;
}

/* =========================================================
   CHAT
========================================================= */

.chatBox{
    height:240px;
    overflow:auto;

    padding:12px;

    border-radius:13px;

    border:1px solid rgba(84,231,255,.15);

    background:rgba(0,0,0,.25);
}

.chatMessage{
    margin:8px 0;
    color:#c7dae5;
}

.chatMessage b{
    color:#54e7ff;
}

.chatInput{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.chatInput input{
    flex:1;

    padding:12px;

    border-radius:10px;

    border:1px solid #28516c;

    outline:none;

    background:#061426;

    color:white;
}

/* =========================================================
   LEADERBOARD
========================================================= */

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:11px;
    text-align:left;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

th{
    color:#54e7ff;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    #hud{
        top:12px;
        left:12px;
        right:12px;
    }

    .hudBox{
        min-width:190px;
        padding:10px 12px;
    }

    .hpTitle,
    .hpNumber{
        font-size:14px;
    }

    .scoreBox{
        font-size:13px;
    }

    #gameTitle{
        display:none;
    }

    #miniMap{
        width:145px;
        height:105px;
    }

    .onlineBox{
        font-size:11px;
        padding:7px 10px;
    }

    #dpad{
        left:15px;
        bottom:15px;
        transform:scale(.78);
        transform-origin:bottom left;
    }

    #attackButton{
        right:15px;
        bottom:18px;
        min-width:170px;
        min-height:62px;
        border-radius:20px;
        font-size:15px;
    }

    #pauseButton{
        top:145px;
        right:12px;
        font-size:11px;
    }
}

@media(max-width:450px){

    #miniMap{
        width:120px;
        height:86px;
    }

    .hudBox{
        min-width:175px;
    }

    #attackButton{
        min-width:150px;
        padding:10px;
    }
}
</style>
</head>

<body>

<div id="gameScreen">

<canvas id="gameCanvas"></canvas>

<div id="gameTitle">
    ⚔️ CUBESADV_KNIGHT
</div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="leftHud">

        <div class="hudBox">

            <div class="hpHeader">

                <span class="hpTitle">
                    ❤️ HP
                </span>

                <span
                    class="hpNumber"
                    id="hpText">
                    100/100
                </span>

            </div>

            <div class="hpBar">
                <div id="hpFill"></div>
            </div>

        </div>

        <div class="hudBox scoreBox">

            ⭐ SCORE:
            <span id="scoreText">0</span>

        </div>

    </div>


    <div class="rightHud">

        <div class="onlineBox">

            <span class="onlineDot"></span>

            ONLINE
            <span id="onlineText">4</span>

        </div>

        <canvas
            id="miniMap"
            width="220"
            height="158">
        </canvas>

    </div>

</div>


<div id="crosshair"></div>


<!-- =====================================================
     D-PAD
===================================================== -->

<div id="dpad">

    <button
        class="moveBtn"
        id="up"
        data-key="ArrowUp">
        ▲
    </button>

    <button
        class="moveBtn"
        id="left"
        data-key="ArrowLeft">
        ◀
    </button>

    <button
        class="moveBtn"
        id="down"
        data-key="ArrowDown">
        ▼
    </button>

    <button
        class="moveBtn"
        id="right"
        data-key="ArrowRight">
        ▶
    </button>

</div>


<!-- =====================================================
     ATTACK
===================================================== -->

<button id="attackButton">

    ⚔️ SERANG

    <span class="attackCooldown">
        SPACE
    </span>

</button>


<button id="pauseButton">
    Ⅱ PAUSE
</button>


<div id="toast"></div>

</div>


<!-- =====================================================
     PAUSE
===================================================== -->

<div
    class="overlay"
    id="pauseOverlay">

    <div class="modal">

        <h2>Ⅱ GAME PAUSED</h2>

        <p>
            Permainan sedang dihentikan sementara.
        </p>

        <div class="modalButtons">

            <button
                class="bigBtn"
                id="resumeBtn">
                ▶ RESUME
            </button>

            <button
                class="bigBtn secondary"
                id="restartBtn">
                🔄 RESTART
            </button>

            <button
                class="bigBtn secondary"
                id="saveBtn">
                💾 SAVE
            </button>

            <button
                class="bigBtn secondary"
                id="loadBtn">
                📂 LOAD
            </button>

            <button
                class="bigBtn secondary"
                id="playersBtn">
                👥 PLAYERS
            </button>

            <button
                class="bigBtn secondary"
                id="rankBtn">
                🏆 LEADERBOARD
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div
    class="overlay"
    id="gameOverOverlay">

    <div class="modal">

        <h2>💀 GAME OVER</h2>

        <p>
            Knight telah dikalahkan.
        </p>

        <p>
            Final Score:
            <b id="finalScore">0</b>
        </p>

        <div class="modalButtons">

            <button
                class="bigBtn"
                id="gameOverRestart">
                ⚔️ MAIN LAGI
            </button>

            <button
                class="bigBtn secondary"
                id="gameOverRank">
                🏆 LEADERBOARD
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     PLAYERS
===================================================== -->

<div
    class="overlay"
    id="playersOverlay">

    <div class="modal">

        <h2>👥 PLAYERS ONLINE</h2>

        <div class="playerList">

            <div class="playerRow">

                <span>
                    <i
                        class="dot"
                        style="
                        background:#54e7ff;
                        box-shadow:0 0 10px #54e7ff;
                        ">
                    </i>

                    CubesAdv_Knight
                </span>

                <b id="myScore">
                    0
                </b>

            </div>


            <div class="playerRow">

                <span>
                    <i
                        class="dot"
                        style="
                        background:#9a62ff;
                        box-shadow:0 0 10px #9a62ff;
                        ">
                    </i>

                    ShadowFox
                </span>

                <b>120</b>

            </div>


            <div class="playerRow">

                <span>
                    <i
                        class="dot"
                        style="
                        background:#42ffae;
                        box-shadow:0 0 10px #42ffae;
                        ">
                    </i>

                    CrystalFox
                </span>

                <b>90</b>

            </div>


            <div class="playerRow">

                <span>
                    <i
                        class="dot"
                        style="
                        background:#ff4168;
                        box-shadow:0 0 10px #ff4168;
                        ">
                    </i>

                    RedKnight
                </span>

                <b>70</b>

            </div>

        </div>

        <button
            class="bigBtn secondary"
            data-close="playersOverlay">
            ✕ CLOSE
        </button>

    </div>

</div>


<!-- =====================================================
     LEADERBOARD
===================================================== -->

<div
    class="overlay"
    id="rankOverlay">

    <div class="modal">

        <h2>🏆 LEADERBOARD</h2>

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>PLAYER</th>
                    <th>SCORE</th>
                </tr>

            </thead>

            <tbody
                id="leaderboardBody">
            </tbody>

        </table>

        <br>

        <button
            class="bigBtn secondary"
            data-close="rankOverlay">
            ✕ CLOSE
        </button>

    </div>

</div>


<script>
/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const miniMap =
    document.getElementById("miniMap");

const miniCtx =
    miniMap.getContext("2d");


/* =========================================================
   WORLD
========================================================= */

let W = 1200;
let H = 750;

let scaleX = 1;
let scaleY = 1;

function resizeCanvas(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    scaleX = W / 1200;
    scaleY = H / 750;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   GAME STATE
========================================================= */

let score = 0;

let paused = false;

let gameOver = false;

let attackCooldown = 0;

let shake = 0;

const keys = {};

let particles = [];

let projectiles = [];

let floatingTexts = [];

let stars = [];

let crystals = [];

let lastTime = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:600,

    y:375,

    size:40,

    speed:4.8,

    hp:100,

    maxHp:100,

    invincible:0,

    tail:[]

};


/* =========================================================
   ENEMIES
========================================================= */

const enemies = [

    {
        x:780,
        y:570,
        size:40,
        speed:1.2,
        hp:100,
        maxHp:100,
        color:"#ff4168",
        hit:0
    },

    {
        x:930,
        y:250,
        size:38,
        speed:1.05,
        hp:100,
        maxHp:100,
        color:"#ff3f91",
        hit:0
    }

];


/* =========================================================
   OTHER PLAYERS
========================================================= */

const onlinePlayers = [

    {
        name:"ShadowFox",
        x:970,
        y:620,
        color:"#9a62ff",
        dx:.65,
        dy:-.35,
        score:120
    },

    {
        name:"CrystalFox",
        x:270,
        y:690,
        color:"#42ffae",
        dx:.5,
        dy:-.55,
        score:90
    },

    {
        name:"RedKnight",
        x:180,
        y:280,
        color:"#ff4168",
        dx:.45,
        dy:.7,
        score:70
    }

];


/* =========================================================
   STARS
========================================================= */

function createStars(){

    stars = [];

    for(let i=0;i<230;i++){

        stars.push({

            x:Math.random()*1200,

            y:Math.random()*750,

            r:Math.random()*1.7+.35,

            speed:Math.random()*.35+.04,

            alpha:Math.random()*.7+.2

        });

    }

}

createStars();


/* =========================================================
   CRYSTALS
========================================================= */

function createCrystals(){

    crystals = [];

    for(let i=0;i<8;i++){

        crystals.push({

            x:80 + Math.random()*1040,

            y:100 + Math.random()*580,

            size:22,

            pulse:Math.random()*6

        });

    }

}

createCrystals();


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key] = true;

        if(
            [
                " ",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(e.key)
        ){

            e.preventDefault();

        }

        if(
            e.key === " " &&
            !e.repeat
        ){

            attack();

        }

        if(
            e.key === "Escape" &&
            !gameOver
        ){

            togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[e.key] = false;

    }
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
.querySelectorAll(".moveBtn")
.forEach(btn=>{

    const key =
        btn.dataset.key;

    const start = e=>{

        e.preventDefault();

        keys[key] = true;

    };

    const end = e=>{

        e.preventDefault();

        keys[key] = false;

    };

    btn.addEventListener(
        "pointerdown",
        start
    );

    btn.addEventListener(
        "pointerup",
        end
    );

    btn.addEventListener(
        "pointercancel",
        end
    );

    btn.addEventListener(
        "pointerleave",
        end
    );

});


document
.getElementById("attackButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        attack();

    }
);


/* =========================================================
   RANDOM POSITION
========================================================= */

function randomPosition(size){

    return {

        x:40 + Math.random()*(1200-size-80),

        y:80 + Math.random()*(750-size-120)

    };

}


/* =========================================================
   COLLISION
========================================================= */

function collision(a,b){

    return (

        a.x < b.x+b.size &&
        a.x+a.size > b.x &&
        a.y < b.y+b.size &&
        a.y+a.size > b.y

    );

}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

    if(
        paused ||
        gameOver ||
        attackCooldown > 0
    ){

        return;

    }

    attackCooldown = .38;

    const centerX =
        player.x + player.size/2;

    const centerY =
        player.y + player.size/2;


    /* Target nearest enemy */

    let target = null;

    let nearest = Infinity;

    enemies.forEach(enemy=>{

        const dx =
            enemy.x - player.x;

        const dy =
            enemy.y - player.y;

        const dist =
            Math.hypot(dx,dy);

        if(dist < nearest){

            nearest = dist;

            target = enemy;

        }

    });


    if(!target)
        return;


    const dx =
        target.x -
        centerX;

    const dy =
        target.y -
        centerY;

    const length =
        Math.hypot(dx,dy) || 1;


    projectiles.push({

        x:centerX,

        y:centerY,

        vx:dx/length*11,

        vy:dy/length*11,

        life:1,

        size:7

    });


    createBurst(
        centerX,
        centerY,
        "#54e7ff",
        12
    );

}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(amount){

    if(player.invincible > 0)
        return;

    player.hp -= amount;

    player.invincible = .75;

    shake = 8;

    createBurst(
        player.x+20,
        player.y+20,
        "#ff4168",
        20
    );

    addFloatingText(
        player.x+20,
        player.y,
        "-" + amount,
        "#ff4168"
    );

    updateHUD();

    if(player.hp <= 0){

        player.hp = 0;

        gameOver = true;

        document
        .getElementById("finalScore")
        .textContent = score;

        showOverlay(
            "gameOverOverlay"
        );

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(paused || gameOver)
        return;

    const delta =
        Math.min(dt/16.67,2);


    attackCooldown =
        Math.max(
            0,
            attackCooldown-dt/1000
        );

    player.invincible =
        Math.max(
            0,
            player.invincible-dt/1000
        );


    /* MOVEMENT */

    let dx = 0;
    let dy = 0;

    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx--;

    }

    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx++;

    }

    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dy--;

    }

    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dy++;

    }


    if(dx !== 0 || dy !== 0){

        const len =
            Math.hypot(dx,dy);

        dx /= len;
        dy /= len;

        player.x +=
            dx*player.speed*delta;

        player.y +=
            dy*player.speed*delta;

    }


    player.x =
        Math.max(
            0,
            Math.min(
                1200-player.size,
                player.x
            )
        );

    player.y =
        Math.max(
            60,
            Math.min(
                750-player.size,
                player.y
            )
        );


    /* PLAYER TRAIL */

    player.tail.unshift({

        x:player.x+20,

        y:player.y+20

    });

    if(player.tail.length>22)
        player.tail.pop();


    /* CRYSTALS */

    crystals.forEach(crystal=>{

        crystal.pulse += .08*delta;

        if(
            collision(
                player,
                crystal
            )
        ){

            score += 10;

            createBurst(
                crystal.x+11,
                crystal.y+11,
                "#ffd426",
                22
            );

            addFloatingText(
                crystal.x,
                crystal.y,
                "+10",
                "#ffd426"
            );

            const p =
                randomPosition(
                    crystal.size
                );

            crystal.x = p.x;
            crystal.y = p.y;

            updateHUD();

        }

    });


    /* ENEMIES */

    enemies.forEach(enemy=>{

        enemy.hit =
            Math.max(
                0,
                enemy.hit-dt/1000
            );


        const ex =
            player.x-enemy.x;

        const ey =
            player.y-enemy.y;

        const distance =
            Math.hypot(ex,ey)||1;


        enemy.x +=
            ex/distance *
            enemy.speed *
            delta;

        enemy.y +=
            ey/distance *
            enemy.speed *
            delta;


        if(
            collision(
                player,
                enemy
            )
        ){

            damagePlayer(8);

        }

    });


    /* PROJECTILES */

    projectiles.forEach(p=>{

        p.x += p.vx*delta;
        p.y += p.vy*delta;

        p.life -= .025*delta;


        enemies.forEach(enemy=>{

            const pseudo = {

                x:p.x-5,

                y:p.y-5,

                size:10

            };


            if(
                p.life>0 &&
                collision(
                    pseudo,
                    enemy
                )
            ){

                enemy.hp -= 25;

                enemy.hit = .18;

                p.life = 0;

                createBurst(
                    p.x,
                    p.y,
                    "#ff4b78",
                    18
                );

                addFloatingText(
                    enemy.x,
                    enemy.y,
                    "-25",
                    "#ff5c80"
                );


                if(enemy.hp <= 0){

                    score += 50;

                    createBurst(
                        enemy.x+20,
                        enemy.y+20,
                        "#ff4168",
                        45
                    );

                    addFloatingText(
                        enemy.x,
                        enemy.y,
                        "+50 ENEMY",
                        "#ff4168"
                    );


                    const pos =
                        randomPosition(
                            enemy.size
                        );

                    enemy.x = pos.x;
                    enemy.y = pos.y;

                    enemy.hp =
                        enemy.maxHp;

                    updateHUD();

                }

            }

        });

    });


    projectiles =
        projectiles.filter(
            p=>
                p.life>0 &&
                p.x>-50 &&
                p.x<1250 &&
                p.y>-50 &&
                p.y<800
        );


    /* OTHER PLAYERS */

    onlinePlayers.forEach(p=>{

        p.x += p.dx*delta;
        p.y += p.dy*delta;

        if(
            p.x<30 ||
            p.x>1150
        ){

            p.dx *= -1;

        }

        if(
            p.y<80 ||
            p.y>700
        ){

            p.dy *= -1;

        }

    });


    /* PARTICLES */

    particles.forEach(p=>{

        p.x += p.vx*delta;
        p.y += p.vy*delta;

        p.vy += .025*delta;

        p.life -= p.decay*delta;

    });

    particles =
        particles.filter(
            p=>p.life>0
        );


    /* FLOATING TEXT */

    floatingTexts.forEach(f=>{

        f.y -= .7*delta;

        f.life -= .018*delta;

    });

    floatingTexts =
        floatingTexts.filter(
            f=>f.life>0
        );


    if(shake>0){

        shake -= .5*delta;

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function createBurst(
    x,
    y,
    color,
    count
){

    for(let i=0;i<count;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            Math.random()*4+1;

        particles.push({

            x:x,

            y:y,

            vx:Math.cos(angle)*speed,

            vy:Math.sin(angle)*speed,

            size:Math.random()*4+1,

            life:1,

            decay:.018+Math.random()*.025,

            color:color

        });

    }

}


function addFloatingText(
    x,
    y,
    text,
    color
){

    floatingTexts.push({

        x:x,

        y:y,

        text:text,

        color:color,

        life:1

    });

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(time){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#061a35"
    );

    gradient.addColorStop(
        .55,
        "#03152b"
    );

    gradient.addColorStop(
        1,
        "#020916"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* GRID */

    const grid = 38;

    ctx.strokeStyle =
        "rgba(47,156,205,.12)";

    ctx.lineWidth = 1;

    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* STARS */

    stars.forEach(s=>{

        s.y += s.speed;

        if(s.y>750)
            s.y=0;


        const x =
            s.x*scaleX;

        const y =
            s.y*scaleY;

        ctx.globalAlpha =
            s.alpha;

        ctx.fillStyle =
            "#e9fbff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    ctx.globalAlpha=1;


    /* CENTER GLOW */

    const glow =
        ctx.createRadialGradient(
            W/2,
            H/2,
            20,
            W/2,
            H/2,
            Math.max(W,H)*.65
        );

    glow.addColorStop(
        0,
        "rgba(22,113,255,.08)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =========================================================
   CRYSTAL
========================================================= */

function drawCrystal(c){

    const x =
        c.x*scaleX;

    const y =
        c.y*scaleY;

    const size =
        c.size*scaleX;

    const pulse =
        Math.sin(c.pulse)*3;


    ctx.save();

    ctx.translate(
        x+size/2,
        y+size/2
    );

    ctx.rotate(
        Math.sin(c.pulse*.5)*.1
    );

    ctx.shadowBlur =
        25+pulse;

    ctx.shadowColor =
        "#ffd426";

    ctx.fillStyle =
        "#ffd426";


    ctx.beginPath();

    ctx.moveTo(
        0,
        -16-pulse
    );

    ctx.lineTo(
        13,
        0
    );

    ctx.lineTo(
        0,
        17+pulse
    );

    ctx.lineTo(
        -13,
        0
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#fff7a6";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -10
    );

    ctx.lineTo(
        6,
        0
    );

    ctx.lineTo(
        0,
        5
    );

    ctx.lineTo(
        -5,
        0
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const x =
        player.x*scaleX;

    const y =
        player.y*scaleY;

    const size =
        player.size*scaleX;

    const cx =
        x+size/2;

    const cy =
        y+size/2;


    /* TRAIL */

    player.tail.forEach(
        (t,i)=>{

            const alpha =
                (1-i/player.tail.length)*.5;

            const tx =
                t.x*scaleX;

            const ty =
                t.y*scaleY;

            ctx.save();

            ctx.globalAlpha =
                alpha;

            ctx.fillStyle =
                "#249cff";

            ctx.shadowBlur =
                18;

            ctx.shadowColor =
                "#249cff";

            ctx.beginPath();

            ctx.arc(
                tx,
                ty,
                4+(1-i/player.tail.length)*7,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.restore();

        }
    );


    ctx.save();

    ctx.shadowBlur =
        30;

    ctx.shadowColor =
        player.invincible>.35
        ? "#ff4168"
        : "#249cff";

    ctx.fillStyle =
        player.invincible>.35
        ? "#ff4168"
        : "#249cff";


    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        size,
        size,
        9
    );

    ctx.fill();


    /* SHIELD */

    ctx.shadowBlur=0;

    ctx.fillStyle =
        "#d5f7ff";

    ctx.beginPath();

    ctx.moveTo(
        cx,
        y+8
    );

    ctx.lineTo(
        x+size-8,
        cy-3
    );

    ctx.lineTo(
        cx,
        y+size-6
    );

    ctx.lineTo(
        x+8,
        cy-3
    );

    ctx.closePath();

    ctx.fill();


    /* HELMET */

    ctx.fillStyle =
        "#e7fbff";

    ctx.fillRect(
        x+9,
        y+5,
        size-18,
        12
    );


    /* VISOR */

    ctx.fillStyle =
        "#18384e";

    ctx.fillRect(
        x+11,
        y+10,
        size-22,
        5
    );


    /* EYES */

    ctx.fillStyle =
        "#54f4ff";

    ctx.shadowBlur =
        10;

    ctx.shadowColor =
        "#54f4ff";

    ctx.fillRect(
        x+13,
        y+11,
        4,
        3
    );

    ctx.fillRect(
        x+23,
        y+11,
        4,
        3
    );


    ctx.restore();

}


/* =========================================================
   ENEMY
========================================================= */

function drawEnemy(enemy){

    const x =
        enemy.x*scaleX;

    const y =
        enemy.y*scaleY;

    const size =
        enemy.size*scaleX;


    ctx.save();

    ctx.shadowBlur =
        28;

    ctx.shadowColor =
        enemy.color;

    ctx.fillStyle =
        enemy.hit>0
        ? "#ffffff"
        : enemy.color;


    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        size,
        size,
        9
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";


    ctx.fillRect(
        x+9,
        y+12,
        6,
        7
    );

    ctx.fillRect(
        x+23,
        y+12,
        6,
        7
    );


    ctx.fillStyle="#111522";


    ctx.fillRect(
        x+11,
        y+14,
        3,
        4
    );

    ctx.fillRect(
        x+25,
        y+14,
        3,
        4
    );


    /* HP */

    const hpWidth =
        size;

    ctx.fillStyle =
        "rgba(0,0,0,.45)";

    ctx.fillRect(
        x,
        y-10,
        hpWidth,
        4
    );

    ctx.fillStyle =
        "#ff4168";

    ctx.fillRect(
        x,
        y-10,
        hpWidth*
        (enemy.hp/enemy.maxHp),
        4
    );


    ctx.restore();

}


/* =========================================================
   OTHER PLAYERS
========================================================= */

function drawOnlinePlayer(p){

    const x =
        p.x*scaleX;

    const y =
        p.y*scaleY;

    ctx.save();

    ctx.shadowBlur=22;

    ctx.shadowColor =
        p.color;

    ctx.fillStyle =
        p.color;


    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        34*scaleX,
        34*scaleY,
        8
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";

    ctx.font =
        "12px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        p.name,
        x+17,
        y-9
    );


    ctx.restore();

}


/* =========================================================
   PROJECTILES
========================================================= */

function drawProjectiles(){

    projectiles.forEach(p=>{

        const x =
            p.x*scaleX;

        const y =
            p.y*scaleY;


        ctx.save();

        ctx.shadowBlur=25;

        ctx.shadowColor="#68eaff";

        ctx.fillStyle="#68eaff";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.restore();

    });

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles(){

    particles.forEach(p=>{

        ctx.save();

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur=12;

        ctx.shadowColor =
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x*scaleX,
            p.y*scaleY,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    });

}


/* =========================================================
   FLOATING TEXT
========================================================= */

function drawFloatingTexts(){

    floatingTexts.forEach(f=>{

        ctx.save();

        ctx.globalAlpha =
            f.life;

        ctx.fillStyle =
            f.color;

        ctx.font =
            "bold 17px Arial";

        ctx.textAlign =
            "center";

        ctx.shadowBlur=10;

        ctx.shadowColor =
            f.color;


        ctx.fillText(
            f.text,
            f.x*scaleX,
            f.y*scaleY
        );


        ctx.restore();

    });

}


/* =========================================================
   MINIMAP
========================================================= */

function drawMiniMap(){

    const mw =
        miniMap.width;

    const mh =
        miniMap.height;


    miniCtx.clearRect(
        0,
        0,
        mw,
        mh
    );


    miniCtx.fillStyle =
        "#03172d";

    miniCtx.fillRect(
        0,
        0,
        mw,
        mh
    );


    miniCtx.strokeStyle =
        "rgba(84,231,255,.15)";

    for(
        let x=0;
        x<mw;
        x+=20
    ){

        miniCtx.beginPath();

        miniCtx.moveTo(x,0);

        miniCtx.lineTo(x,mh);

        miniCtx.stroke();

    }


    for(
        let y=0;
        y<mh;
        y+=20
    ){

        miniCtx.beginPath();

        miniCtx.moveTo(0,y);

        miniCtx.lineTo(mw,y);

        miniCtx.stroke();

    }


    const sx =
        mw/1200;

    const sy =
        mh/750;


    /* crystals */

    crystals.forEach(c=>{

        miniCtx.fillStyle =
            "#ffd426";

        miniCtx.beginPath();

        miniCtx.arc(
            c.x*sx,
            c.y*sy,
            4,
            0,
            Math.PI*2
        );

        miniCtx.fill();

    });


    /* enemies */

    enemies.forEach(enemy=>{

        miniCtx.fillStyle =
            enemy.color;

        miniCtx.beginPath();

        miniCtx.arc(
            enemy.x*sx,
            enemy.y*sy,
            5,
            0,
            Math.PI*2
        );

        miniCtx.fill();

    });


    /* online */

    onlinePlayers.forEach(p=>{

        miniCtx.fillStyle =
            p.color;

        miniCtx.beginPath();

        miniCtx.arc(
            p.x*sx,
            p.y*sy,
            4,
            0,
            Math.PI*2
        );

        miniCtx.fill();

    });


    /* player */

    miniCtx.fillStyle =
        "#54e7ff";

    miniCtx.shadowBlur=8;

    miniCtx.shadowColor =
        "#54e7ff";

    miniCtx.beginPath();

    miniCtx.arc(
        (player.x+20)*sx,
        (player.y+20)*sy,
        6,
        0,
        Math.PI*2
    );

    miniCtx.fill();

    miniCtx.shadowBlur=0;

}


/* =========================================================
   DRAW
========================================================= */

function draw(time){

    ctx.save();


    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }


    drawBackground(time);


    crystals.forEach(
        drawCrystal
    );


    onlinePlayers.forEach(
        drawOnlinePlayer
    );


    enemies.forEach(
        drawEnemy
    );


    drawProjectiles();

    drawPlayer();

    drawParticles();

    drawFloatingTexts();


    ctx.restore();


    drawMiniMap();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
    .getElementById("scoreText")
    .textContent =
        score;


    document
    .getElementById("hpText")
    .textContent =
        Math.max(
            0,
            Math.ceil(player.hp)
        ) +
        "/100";


    document
    .getElementById("hpFill")
    .style.width =
        Math.max(
            0,
            player.hp
        ) +
        "%";


    document
    .getElementById("myScore")
    .textContent =
        score;

}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    score=0;

    gameOver=false;

    paused=false;

    player.hp=100;

    player.x=600;

    player.y=375;

    player.tail=[];

    attackCooldown=0;

    particles=[];

    projectiles=[];

    floatingTexts=[];


    enemies[0].x=780;
    enemies[0].y=570;
    enemies[0].hp=100;


    enemies[1].x=930;
    enemies[1].y=250;
    enemies[1].hp=100;


    createCrystals();

    updateHUD();

    hideOverlay(
        "gameOverOverlay"
    );

    hideOverlay(
        "pauseOverlay"
    );

    showToast(
        "⚔️ Arena siap!"
    );

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(gameOver)
        return;


    paused =
        !paused;


    if(paused){

        showOverlay(
            "pauseOverlay"
        );

    }else{

        hideOverlay(
            "pauseOverlay"
        );

    }

}


/* =========================================================
   OVERLAY
========================================================= */

function showOverlay(id){

    document
    .getElementById(id)
    .classList
    .add("show");

}


function hideOverlay(id){

    document
    .getElementById(id)
    .classList
    .remove("show");

}


document
.querySelectorAll("[data-close]")
.forEach(btn=>{

    btn.onclick=()=>{

        hideOverlay(
            btn.dataset.close
        );

    };

});


/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            2000
        );

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    const data={

        score:score,

        hp:player.hp,

        x:player.x,

        y:player.y

    };


    localStorage.setItem(
        "cubesKnightSave",
        JSON.stringify(data)
    );


    showToast(
        "💾 Game berhasil disimpan!"
    );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    const raw =
        localStorage.getItem(
            "cubesKnightSave"
        );


    if(!raw){

        showToast(
            "📂 Belum ada save!"
        );

        return;

    }


    try{

        const data =
            JSON.parse(raw);


        score =
            data.score ?? 0;

        player.hp =
            data.hp ?? 100;

        player.x =
            data.x ?? 600;

        player.y =
            data.y ?? 375;


        gameOver=false;

        paused=false;


        updateHUD();


        hideOverlay(
            "pauseOverlay"
        );


        showToast(
            "📂 Save berhasil dimuat!"
        );


    }catch{

        showToast(
            "❌ Save rusak!"
        );

    }

}


/* =========================================================
   LEADERBOARD
========================================================= */

function updateLeaderboard(){

    const list=[

        {
            name:"CubesAdv_Knight",
            score:score
        },

        {
            name:"ShadowFox",
            score:120
        },

        {
            name:"CrystalFox",
            score:90
        },

        {
            name:"RedKnight",
            score:70
        },

        {
            name:"MoonBlade",
            score:55
        }

    ];


    list.sort(
        (a,b)=>
            b.score-a.score
    );


    document
    .getElementById(
        "leaderboardBody"
    )
    .innerHTML =
        list.map(
            (p,i)=>`

                <tr>

                    <td>${i+1}</td>

                    <td>${p.name}</td>

                    <td>${p.score}</td>

                </tr>

            `
        )
        .join("");

}


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("attackButton")
.addEventListener(
    "click",
    attack
);


document
.getElementById("pauseButton")
.onclick =
    togglePause;


document
.getElementById("resumeBtn")
.onclick =
    ()=>{

        paused=false;

        hideOverlay(
            "pauseOverlay"
        );

    };


document
.getElementById("restartBtn")
.onclick =
    resetGame;


document
.getElementById("saveBtn")
.onclick =
    saveGame;


document
.getElementById("loadBtn")
.onclick =
    loadGame;


document
.getElementById("playersBtn")
.onclick =
    ()=>{

        hideOverlay(
            "pauseOverlay"
        );

        showOverlay(
            "playersOverlay"
        );

    };


document
.getElementById("rankBtn")
.onclick =
    ()=>{

        hideOverlay(
            "pauseOverlay"
        );

        updateLeaderboard();

        showOverlay(
            "rankOverlay"
        );

    };


document
.getElementById("gameOverRestart")
.onclick =
    resetGame;


document
.getElementById("gameOverRank")
.onclick =
    ()=>{

        hideOverlay(
            "gameOverOverlay"
        );

        updateLeaderboard();

        showOverlay(
            "rankOverlay"
        );

    };


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    const dt =
        time-lastTime;

    lastTime=time;

    update(dt);

    draw(time);

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

updateHUD();

updateLeaderboard();

requestAnimationFrame(
    gameLoop
);

</script>
