<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 50% 20%, #172b4d 0%, #090d18 45%, #03050b 100%);
    color: #ecf0f1;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;

}

.game-title {
    font-size: clamp(1.7rem, 5vw, 2.7rem);
    margin-bottom: 10px;
    font-weight: 800;
    letter-spacing: 2px;

}

.game-title span {

}

.game-wrapper {
    position: relative;

}

#gameCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    background: #050914;
    border: 2px solid rgba(70, 190, 255, 0.65);
    border-radius: 16px;
    box-shadow:

        0 0 35px rgba(20, 110, 255, 0.15),
        inset 0 0 50px rgba(0, 0, 0, 0.7);
    touch-action: none;
}

.hud {
    position: absolute;
    left: 15px;
    top: 15px;
    min-width: 170px;
    padding: 10px 15px;
    border: 1px solid rgba(100, 210, 255, 0.4);
    border-radius: 12px;

    box-shadow: 0 0 15px rgba(0, 150, 255, 0.15);
    pointer-events: none;
}

.hud-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;

}

.score {

    font-weight: 800;

}

.health-container {

}

.health-label {

}

.health-bar {

.health-fill {

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* =========================================================
   COLORS
========================================================= */

const COLOR_BG =
    "#050914";

const COLOR_KNIGHT =
    "#249cff";

const COLOR_CRYSTAL =
    "#ffe033";

const COLOR_ENEMY =
    "#ff4055";

const COLOR_TEXT =
    "#ecf0f1";


/* =========================================================
   KEYS
========================================================= */

const keys = {};


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:
        canvas.width / 2 - 20,

    y:
        canvas.height / 2 - 20,

    size:
        40,

    speed:
        5,

    tail: [],

    color:
        COLOR_KNIGHT

};


/* =========================================================
   CRYSTAL
========================================================= */

const crystal = {

    x: 0,

    y: 0,

    size: 22

};


/* =========================================================
   ENEMY
========================================================= */

const enemy = {

    x: 0,

    y: 0,

    size: 38,

    speed: 1.6,

    hp: 100,

    maxHp: 100,

    hitFlash: 0

};


/* =========================================================
   GAME STATE
========================================================= */

let score = 0;

let health = 100;

let gameOver = false;

let paused = false;

let lastTime = 0;

let screenShake = 0;

let playing = false;


/* =========================================================
   PARTICLES
========================================================= */

const particles = [];


/* =========================================================
   STARS
========================================================= */

const stars = [];

for (
    let i = 0;
    i < 120;
    i++
) {

    stars.push({

        x:
            Math.random() *
            canvas.width,

        y:
            Math.random() *
            canvas.height,

        size:
            Math.random() * 2 + 0.5,

        speed:
            Math.random() * 0.5 + 0.1,

        alpha:
            Math.random() * 0.7 + 0.2

    });

}


/* =========================================================
   RANDOM POSITION
========================================================= */

function randomPosition(
    size
) {

    return {

        x:
            20 +
            Math.random() *
            (
                canvas.width -
                size -
                40
            ),

        y:
            20 +
            Math.random() *
            (
                canvas.height -
                size -
                40
            )

    };

}


/* =========================================================
   RESET
========================================================= */

function resetPositions() {

    let c =
        randomPosition(
            crystal.size
        );

    crystal.x =
        c.x;

    crystal.y =
        c.y;


    let e =
        randomPosition(
            enemy.size
        );

    enemy.x =
        e.x;

    enemy.y =
        e.y;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    player.x =
        canvas.width / 2 -
        player.size / 2;

    player.y =
        canvas.height / 2 -
        player.size / 2;

    player.tail = [];

    score = 0;

    health = 100;

    enemy.hp =
        enemy.maxHp;

    enemy.hitFlash =
        0;

    gameOver = false;

    resetPositions();

    updateHUD();

}


/* =========================================================
   COLLISION
========================================================= */

function checkCollision(
    a,
    b
) {

    return (

        a.x <
        b.x + b.size &&

        a.x + a.size >
        b.x &&

        a.y <
        b.y + b.size &&

        a.y + a.size >
        b.y

    );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    amount,
    type = "normal"
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() * 4 +
            1;

        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                Math.random() * 4 +
                2,

            type:
                type

        });

    }

}


/* =========================================================
   UPDATE PARTICLES
========================================================= */

function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vx *=
            0.96;

        p.vy *=
            0.96;

        p.life -=
            0.025;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}

/* =========================================================
   UPDATE GAME
========================================================= */

function update() {

    if (
        paused ||
        gameOver ||
        !playing
    ) {

        return;

    }


    let dx = 0;

    let dy = 0;


    if (
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ) {

        dx--;

    }


    if (
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ) {

        dx++;

    }


    if (
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ) {

        dy--;

    }


    if (
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ) {

        dy++;

    }


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(
                dx,
                dy
            );

        dx /= length;

        dy /= length;

        player.x +=
            dx *
            player.speed;

        player.y +=
            dy *
            player.speed;


        player.tail.unshift({

            x:
                player.x +
                player.size / 2,

            y:
                player.y +
                player.size / 2

        });


        if (
            player.tail.length >
            22
        ) {

            player.tail.pop();

        }

    } else {

        if (
            player.tail.length >
            0
        ) {

            player.tail.pop();

        }

    }


    player.x =
        Math.max(
            10,
            Math.min(
                canvas.width -
                player.size -
                10,
                player.x
            )
        );


    player.y =
        Math.max(
            10,
            Math.min(
                canvas.height -
                player.size -
                10,
                player.y
            )
        );


    /* ENEMY AI */

    const ex =
        player.x -
        enemy.x;

    const ey =
        player.y -
        enemy.y;

    const distance =
        Math.hypot(
            ex,
            ey
        );


    if (
        distance > 1
    ) {

        enemy.x +=
            (ex / distance) *
            enemy.speed;

        enemy.y +=
            (ey / distance) *
            enemy.speed;

    }


    if (
        checkCollision(
            player,
            crystal
        )
    ) {

        score += 10;

        createParticles(
            crystal.x + 11,
            crystal.y + 11,
            25,
            "crystal"
        );

        const c =
            randomPosition(
                crystal.size
            );

        crystal.x =
            c.x;

        crystal.y =
            c.y;

        updateHUD();

    }


    if (
        checkCollision(
            player,
            enemy
        )
    ) {

        takeDamage();

    }


    if (
        enemy.hitFlash > 0
    ) {

        enemy.hitFlash--;

    }


    if (
        screenShake > 0
    ) {

        screenShake *= 0.85;

        if (
            screenShake < 0.3
        ) {

            screenShake = 0;

        }

    }

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(
    time
) {

    ctx.save();


    if (
        screenShake > 0
    ) {

        ctx.translate(
            (Math.random() - .5) *
            screenShake,

            (Math.random() - .5) *
            screenShake
        );

    }


    const gradient =
        ctx.createRadialGradient(
            canvas.width / 2,
            canvas.height / 2,
            20,

            canvas.width / 2,
            canvas.height / 2,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#102d50"
    );

    gradient.addColorStop(
        0.55,
        "#071326"
    );

    gradient.addColorStop(
        1,
        "#02050d"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.globalAlpha =
        0.13;

    ctx.strokeStyle =
        "#45cfff";

    ctx.lineWidth =
        1;


    for (
        let x = 0;
        x < canvas.width;
        x += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y < canvas.height;
        y += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    ctx.globalAlpha =
        1;


    /* STARS */

    stars.forEach(
        star => {

            star.y +=
                star.speed;

            if (
                star.y >
                canvas.height
            ) {

                star.y = 0;

            }


            ctx.globalAlpha =
                star.alpha *
                (
                    0.65 +
                    Math.sin(
                        time * 0.002 +
                        star.x
                    ) *
                    0.35
                );

            ctx.fillStyle =
                "#d8f7ff";

            ctx.beginPath();

            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    ctx.globalAlpha =
        1;


    /* ARENA BORDER */

    ctx.strokeStyle =
        "#50dfff55";

    ctx.strokeRect(
        8,
        8,
        canvas.width - 16,
        canvas.height - 16
    );


    ctx.restore();

}


/* =========================================================
   CRYSTAL
========================================================= */

function drawCrystal(
    time
) {

    const cx =
        crystal.x +
        crystal.size / 2;

    const cy =
        crystal.y +
        crystal.size / 2;


    const pulse =
        Math.sin(
            time * 0.006
        ) *
        4;


    ctx.save();

    ctx.shadowBlur =
        30;

    ctx.shadowColor =
        "#ffe600";

    ctx.fillStyle =
        "#ffe033";


    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy - 18 - pulse
    );

    ctx.lineTo(
        cx + 13,
        cy
    );

    ctx.lineTo(
        cx,
        cy + 18 + pulse
    );

    ctx.lineTo(
        cx - 13,
        cy
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#fff5a0";

    ctx.globalAlpha =
        0.8;

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy - 12
    );

    ctx.lineTo(
        cx + 6,
        cy
    );

    ctx.lineTo(
        cx,
        cy + 4
    );

    ctx.lineTo(
        cx - 6,
        cy
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(
    time
) {

    const cx =
        player.x +
        player.size / 2;

    const cy =
        player.y +
        player.size / 2;


    /* TAIL */

    ctx.save();

    for (
        let i =
            player.tail.length - 1;
        i >= 0;
        i--
    ) {

        const segment =
            player.tail[i];

        const alpha =
            1 -
            i /
            Math.max(
                player.tail.length,
                1
            );

        const size =
            7 +
            alpha * 9;

        ctx.globalAlpha =
            alpha * 0.65;

        ctx.fillStyle =
            "#249cff";

        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            "#249cff";

        ctx.beginPath();

        ctx.arc(
            segment.x,
            segment.y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.restore();


    /* PLAYER AURA */

    ctx.save();

    const pulse =
        Math.sin(
            time * 0.006
        );


    ctx.shadowBlur =
        30 +
        pulse * 8;

    ctx.shadowColor =
        player.color;

    ctx.fillStyle =
        player.color;


    /* Body */

    ctx.beginPath();

    ctx.roundRect(
        player.x,
        player.y,
        player.size,
        player.size,
        9
    );

    ctx.fill();


    /* Shield */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "#bcecff";

    ctx.beginPath();

    ctx.moveTo(
        cx,
        player.y + 7
    );

    ctx.lineTo(
        player.x +
        player.size - 8,
        cy - 3
    );

    ctx.lineTo(
        cx,
        player.y +
        player.size - 6
    );

    ctx.lineTo(
        player.x + 8,
        cy - 3
    );

    ctx.closePath();

    ctx.fill();


    /* Helmet */

    ctx.fillStyle =
        "#d9f5ff";

    ctx.fillRect(
        player.x + 9,
        player.y + 5,
        player.size - 18,
        12
    );


    /* Visor */

    ctx.fillStyle =
        "#18334b";

    ctx.fillRect(
        player.x + 11,
        player.y + 10,
        player.size - 22,
        5
    );


    /* Eyes */

    ctx.fillStyle =
        "#5ff2ff";

    ctx.shadowBlur =
        8;

    ctx.shadowColor =
        "#5ff2ff";

    ctx.fillRect(
        player.x + 13,
        player.y + 11,
        4,
        3
    );

    ctx.fillRect(
        player.x + 23,
        player.y + 11,
        4,
        3
    );


    ctx.restore();


    /* PLAYER RING */

    ctx.save();

    ctx.globalAlpha =
        0.35;

    ctx.strokeStyle =
        "#5de9ff";

    ctx.lineWidth =
        1.5;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        28 +
        pulse * 3,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   ENEMY
========================================================= */

function drawEnemy(
    time
) {

    const cx =
        enemy.x +
        enemy.size / 2;

    const cy =
        enemy.y +
        enemy.size / 2;


    ctx.save();

    ctx.shadowBlur =
        28;

    ctx.shadowColor =
        COLOR_ENEMY;

    ctx.fillStyle =
        enemy.hitFlash > 0
            ? "#ffffff"
            : COLOR_ENEMY;


    ctx.beginPath();

    ctx.roundRect(
        enemy.x,
        enemy.y,
        enemy.size,
        enemy.size,
        9
    );

    ctx.fill();


    /* EYES */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        enemy.x + 8,
        enemy.y + 12,
        7,
        5
    );

    ctx.fillRect(
        enemy.x + 23,
        enemy.y + 12,
        7,
        5
    );


    ctx.fillStyle =
        "#25070b";

    ctx.fillRect(
        enemy.x + 11,
        enemy.y + 13,
        3,
        4
    );

    ctx.fillRect(
        enemy.x + 26,
        enemy.y + 13,
        3,
        4
    );


    /* HP BAR */

    ctx.fillStyle =
        "#25070b";

    ctx.fillRect(
        enemy.x,
        enemy.y - 10,
        enemy.size,
        5
    );

    ctx.fillStyle =
        "#ff7080";

    ctx.fillRect(
        enemy.x,
        enemy.y - 10,
        enemy.size *
        (
            enemy.hp /
            enemy.maxHp
        ),
        5
    );


    /* AURA */

    ctx.globalAlpha =
        0.25;

    ctx.strokeStyle =
        "#ff4055";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        29 +
        Math.sin(
            time * 0.005
        ) *
        3,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles() {

    particles.forEach(
        particle => {

            ctx.save();

            ctx.globalAlpha =
                particle.life;


            if (
                particle.type ===
                "damage"
            ) {

                ctx.fillStyle =
                    "#ff4055";

                ctx.shadowColor =
                    "#ff4055";

            } else if (
                particle.type ===
                "crystal"
            ) {

                ctx.fillStyle =
                    "#ffe600";

                ctx.shadowColor =
                    "#ffe600";

            } else {

                ctx.fillStyle =
                    "#55e8ff";

                ctx.shadowColor =
                    "#55e8ff";

            }


            ctx.shadowBlur =
                15;


            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();

        }
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(
    time
) {

    drawBackground(
        time
    );

    drawCrystal(
        time
    );

    drawPlayer(
        time
    );

    drawEnemy(
        time
    );

    drawParticles();

}

function gameLoop(

) {

    );

    requestAnimationFrame(
        gameLoop
    );

}

/* =========================================================
   SOUND
========================================================= */

function playTone(
    frequency,
    duration
) {

    if (
        !U.music &&
        frequency < 400
    ) {

        return;

    }


    try {

        U.audio ??=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const oscillator =
            U.audio.createOscillator();

        const gain =
            U.audio.createGain();


        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            0.025;


        oscillator.connect(
            gain
        );

        gain.connect(
            U.audio.destination
        );


        oscillator.start();

        oscillator.stop(
            U.audio.currentTime +
            duration
        );

    }

    catch (
        error
    ) {}

}


/* =========================================================
   MUSIC
========================================================= */

function musicStart() {

    if (
        !U.music
    ) {

        return;

    }


    try {

        U.audio ??=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const notes = [
            220,
            277,
            330,
            277
        ];

        let index =
            0;


        clearInterval(
            U.musicTimer
        );


        U.musicTimer =
            setInterval(
                () => {

                    if (
                        !U.music
                    ) {

                        return;

                    }

                    playTone(
                        notes[
                            index++ %
                            notes.length
                        ],

/* =========================================================
   MINI MAP
========================================================= */

function drawMiniMap() {

    if (
        !U.map
    ) {

        return;

    }


    const width =
        150;

    const height =
        105;


    mctx.clearRect(
        0,
        0,
        width,
        height
    );


    mctx.fillStyle =
        "#061225";

    mctx.fillRect(
        0,
        0,
        width,
        height
    );


    mctx.strokeStyle =
        "#2b8cff55";

    mctx.strokeRect(
        1,
        1,
        width - 2,
        height - 2
    );


    function dot(
        x,
        y,
        color
    ) {

        mctx.fillStyle =
            color;

        mctx.shadowBlur =
            8;

        mctx.shadowColor =
            color;

        mctx.fillRect(

            x /
                canvas.width *
                width -
                2,

            y /
                canvas.height *
                height -
                2,

            5,

            5

        );

        mctx.shadowBlur =
            0;

    }


    dot(
        player.x,
        player.y,
        "#55e8ff"
    );


    dot(
        crystal.x,
        crystal.y,
        "#ffe600"
    );


    dot(
        enemy.x,
        enemy.y,
        "#ff4f5e"
    );


    onlinePlayers.forEach(
        playerData => {

            dot(
                playerData.x,
                playerData.y,
                playerData.color
            );

        }
    );


    mctx.fillStyle =
        "#9fc3d5";

    mctx.font =
        "9px Arial";

    mctx.fillText(
        "MINI MAP",
        7,
        12
    );

}

/* =========================================================
   ONLINE PLAYER DRAW
========================================================= */

function drawOnlinePlayers() {

    onlinePlayers.forEach(
        onlinePlayer => {

            ctx.save();

            ctx.shadowBlur =
                20;

            ctx.shadowColor =
                onlinePlayer.color;

            ctx.fillStyle =
                onlinePlayer.color;

            ctx.beginPath();

            ctx.roundRect(
                onlinePlayer.x,
                onlinePlayer.y,
                34,
                34,
                8
            );

            ctx.fill();


            ctx.shadowBlur =
                0;

            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "10px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                onlinePlayer.name,
                onlinePlayer.x + 17,
                onlinePlayer.y - 7
            );


            ctx.restore();

        }
    );

}


/* =========================================================
   ORIGINAL DRAW EXTENSION
========================================================= */

const originalDraw =
    draw;


draw =
    function(
        time
    ) {

        originalDraw(
            time
        );

        drawOnlinePlayers();

        drawMiniMap();


        /* PROJECTILES */

        projectiles.forEach(
            projectile => {

                ctx.save();

                ctx.fillStyle =
                    "#a9f8ff";

                ctx.shadowBlur =
                    18;

                ctx.shadowColor =
                    "#42eaff";

                ctx.beginPath();

                ctx.arc(
                    projectile.x,
                    projectile.y,
                    5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                ctx.restore();

            }
        );


        /* ATTACK ARC */

        if (
            U.attacking
        ) {

            const cx =
                player.x + 20;

            const cy =
                player.y + 20;


            let angle =
                -Math.PI / 2;


            if (
                keys["ArrowRight"] ||
                keys["d"] ||
                keys["D"]
            ) {

                angle =
                    0;

            }

            else if (
                keys["ArrowLeft"] ||
                keys["a"] ||
                keys["A"]
            ) {

                angle =
                    Math.PI;

            }

            else if (
                keys["ArrowDown"] ||
                keys["s"] ||
                keys["S"]
            ) {

                angle =
                    Math.PI / 2;

            }


            ctx.save();

            ctx.strokeStyle =
                "#d7fbff";

            ctx.shadowBlur =
                22;

            ctx.shadowColor =
                "#5de9ff";

            ctx.lineWidth =
                6;

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                40,
                angle - 0.7,
                angle + 0.7
            );

            ctx.stroke();

            ctx.restore();

        }

    };


/* =========================================================
   PROJECTILE UPDATE
========================================================= */

const originalUpdate =
    update;


update =
    function() {

        originalUpdate();


        if (
            !paused &&
            !gameOver &&
            playing
        ) {

            U.energy =
                Math.min(
                    100,
                    U.energy +
                    0.18
                );


            projectiles.forEach(
                (
                    projectile,
                    index
                ) => {

                    projectile.x +=
                        projectile.vx;

                    projectile.y +=
                        projectile.vy;

                    projectile.life--;


                    if (
                        projectile.x >
                            enemy.x &&
                        projectile.x <
                            enemy.x +
                            enemy.size &&
                        projectile.y >
                            enemy.y &&
                        projectile.y <
                            enemy.y +
                            enemy.size
                    ) {

                        damageEnemy();

                        projectiles.splice(
                            index,
                            1
                        );

                    }

                    else if (
                        projectile.life <=
                        0
                    ) {

                        projectiles.splice(
                            index,
                            1
                        );

                    }

                }
            );


            /* BOT MOVEMENT */

            onlinePlayers.forEach(
                onlinePlayer => {

                    onlinePlayer.x +=
                        Math.sin(
                            performance.now() /
                            900 +
                            onlinePlayer.y
                        ) *
                        0.45;


                    onlinePlayer.y +=
                        Math.cos(
                            performance.now() /
                            1000 +
                            onlinePlayer.x
                        ) *
                        0.35;


                    onlinePlayer.x =
                        Math.max(
                            20,
                            Math.min(
                                850,
                                onlinePlayer.x
                            )
                        );


                    onlinePlayer.y =
                        Math.max(
                            20,
                            Math.min(
                                620,
                                onlinePlayer.y
                            )
                        );

                }
            );

        }

    };
