<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const miniMap =
    document.getElementById("miniMap");

const miniCtx =
    miniMap.getContext("2d");


/* =====================================================
   WORLD
===================================================== */

let W = 1200;
let H = 750;

let scaleX = 1;
let scaleY = 1;

function resizeCanvas(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    scaleX = W / 1200;
    scaleY = H / 750;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;

let paused = false;

let gameOver = false;

let attackCooldown = 0;

let shake = 0;

const keys = {};

let particles = [];

let projectiles = [];

let floatingTexts = [];

let stars = [];

let crystals = [];

let lastTime = 0;


/* =====================================================
   SOUND SYSTEM
===================================================== */

let audioContext = null;

let soundEnabled = true;

function initAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioCtx){

            audioContext =
                new AudioCtx();

        }

    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

}


function playSound(
    type
){

    if(!soundEnabled)
        return;

    initAudio();

    if(!audioContext)
        return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    let frequency = 300;
    let duration = .08;
    let volume = .06;


    if(type === "attack"){

        frequency = 420;
        duration = .13;
        volume = .10;

        osc.type = "sawtooth";

    }

    else if(type === "hit"){

        frequency = 180;
        duration = .09;
        volume = .08;

        osc.type = "square";

    }

    else if(type === "pickup"){

        frequency = 720;
        duration = .16;
        volume = .07;

        osc.type = "sine";

    }

    else if(type === "damage"){

        frequency = 90;
        duration = .18;
        volume = .12;

        osc.type = "sawtooth";

    }

    else if(type === "death"){

        frequency = 70;
        duration = .5;
        volume = .14;

        osc.type = "sawtooth";

    }

    else if(type === "click"){

        frequency = 520;
        duration = .06;
        volume = .045;

        osc.type = "sine";

    }


    const now =
        audioContext.currentTime;


    osc.frequency.setValueAtTime(
        frequency,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        Math.max(40,frequency*.45),
        now+duration
    );


    gain.gain.setValueAtTime(
        volume,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now+duration
    );


    osc.start(now);

    osc.stop(
        now+duration+.02
    );

}


/* =====================================================
   PLAYER

/* =====================================================

const enemies = [

/* =====================================================
   RANDOM POSITION
===================================================== */

function randomPosition(size){

    return {

        x:
            40 +
            Math.random()*
            (1200-size-80),

        y:
            80 +
            Math.random()*
            (750-size-120)

    };

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

    return (

        a.x < b.x+b.size &&

        a.x+a.size > b.x &&

        a.y < b.y+b.size &&

        a.y+a.size > b.y

    );

}


/* =====================================================
   ATTACK
===================================================== */

function attack(){

    if(
        paused ||
        gameOver ||
        attackCooldown > 0
    ){

        return;

    }


    initAudio();

    playSound("attack");


    attackCooldown = .38;


    const centerX =
        player.x +
        player.size/2;

    const centerY =
        player.y +
        player.size/2;


    let target = null;

    let nearest = Infinity;


    enemies.forEach(enemy=>{

        const dx =
            enemy.x -
            player.x;

        const dy =
            enemy.y -
            player.y;

        const dist =
            Math.hypot(dx,dy);


        if(dist < nearest){

            nearest = dist;

            target = enemy;

        }

    });


    if(!target)
        return;


    const dx =
        target.x -
        centerX;

    const dy =
        target.y -
        centerY;

    const length =
        Math.hypot(dx,dy) || 1;


    projectiles.push({

        x:centerX,

        y:centerY,

        vx:
            dx/length*11,

        vy:
            dy/length*11,

        life:1,

        size:7

    });


    createBurst(
        centerX,
        centerY,
        "#54e7ff",
        14
    );

}


/* =====================================================
   DAMAGE PLAYER
===================================================== */

function damagePlayer(amount){

    if(player.invincible > 0)
        return;


    player.hp -= amount;

    player.invincible = .75;

    shake = 8;


    playSound("damage");


    createBurst(
        player.x+20,
        player.y+20,
        "#ff4168",
        20
    );


    addFloatingText(
        player.x+20,
        player.y,
        "-" + amount,
        "#ff4168"
    );


    updateHUD();


    if(player.hp <= 0){

        player.hp = 0;

        gameOver = true;


        playSound("death");


        document
        .getElementById("finalScore")
        .textContent = score;


        showOverlay(
            "gameOverOverlay"
        );

    }

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

    if(paused || gameOver)
        return;


    const delta =
        Math.min(
            dt/16.67,
            2
        );


    attackCooldown =
        Math.max(
            0,
            attackCooldown -
            dt/1000
        );


    player.invincible =
        Math.max(
            0,
            player.invincible -
            dt/1000
        );


    /* MOVEMENT */

    let dx = 0;
    let dy = 0;


    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx--;

    }


    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx++;

    }


    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dy--;

    }


    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dy++;

    }


    if(dx !== 0 || dy !== 0){

        const len =
            Math.hypot(dx,dy);

        dx /= len;
        dy /= len;


        player.x +=
            dx *
            player.speed *
            delta;


        player.y +=
            dy *
            player.speed *
            delta;

    }


    player.x =
        Math.max(
            0,
            Math.min(
                1200-player.size,
                player.x
            )
        );


    player.y =
        Math.max(
            60,
            Math.min(
                750-player.size,
                player.y
            )
        );


    /* TRAIL */

    player.tail.unshift({

        x:
            player.x+20,

        y:
            player.y+20

    });


    if(player.tail.length > 22)
        player.tail.pop();


    /* CRYSTALS */

    crystals.forEach(crystal=>{

        crystal.pulse +=
            .08*delta;


        if(
            collision(
                player,
                crystal
            )
        ){

            score += 10;


            playSound("pickup");


            createBurst(
                crystal.x+11,
                crystal.y+11,
                "#ffd426",
                24
            );


            addFloatingText(
                crystal.x,
                crystal.y,
                "+10",
                "#ffd426"
            );


            const p =
                randomPosition(
                    crystal.size
                );


            crystal.x = p.x;

            crystal.y = p.y;


            updateHUD();

        }

    });


    /* ENEMIES */

    enemies.forEach(enemy=>{

        enemy.hit =
            Math.max(
                0,
                enemy.hit -
                dt/1000
            );


        const ex =
            player.x -
            enemy.x;

        const ey =
            player.y -
            enemy.y;


        const distance =
            Math.hypot(ex,ey) || 1;


        enemy.x +=
            ex/distance *
            enemy.speed *
            delta;


        enemy.y +=
            ey/distance *
            enemy.speed *
            delta;


        if(
            collision(
                player,
                enemy
            )
        ){

            damagePlayer(8);

        }

    });


    /* PROJECTILES */

    projectiles.forEach(p=>{

        p.x +=
            p.vx*delta;

        p.y +=
            p.vy*delta;


        p.life -=
            .025*delta;


        enemies.forEach(enemy=>{

            const pseudo = {

                x:p.x-5,

                y:p.y-5,

                size:10

            };


            if(
                p.life>0 &&
                collision(
                    pseudo,
                    enemy
                )
            ){

                enemy.hp -= 25;

                enemy.hit = .18;

                p.life = 0;


                playSound("hit");


                createBurst(
                    p.x,
                    p.y,
                    "#ff4b78",
                    18
                );


                addFloatingText(
                    enemy.x,
                    enemy.y,
                    "-25",
                    "#ff5c80"
                );


                if(enemy.hp <= 0){

                    score += 50;


                    createBurst(
                        enemy.x+20,
                        enemy.y+20,
                        "#ff4168",
                        45
                    );


                    addFloatingText(
                        enemy.x,
                        enemy.y,
                        "+50 ENEMY",
                        "#ff4168"
                    );


                    const pos =
                        randomPosition(
                            enemy.size
                        );


                    enemy.x = pos.x;
                    enemy.y = pos.y;

                    enemy.hp =
                        enemy.maxHp;


                    updateHUD();

                }

            }

        });

    });


    projectiles =
        projectiles.filter(
            p=>
                p.life>0 &&
                p.x>-50 &&
                p.x<1250 &&
                p.y>-50 &&
                p.y<800
        );


    /* ONLINE PLAYERS */

    onlinePlayers.forEach(p=>{

        p.x +=
            p.dx*delta;

        p.y +=
            p.dy*delta;


        if(
            p.x<30 ||
            p.x>1150
        ){

            p.dx *= -1;

        }


        if(
            p.y<80 ||
            p.y>700
        ){

            p.dy *= -1;

        }

    });


    /* PARTICLES */

    particles.forEach(p=>{

        p.x +=
            p.vx*delta;

        p.y +=
            p.vy*delta;

        p.vy +=
            .025*delta;

        p.life -=
            p.decay*delta;

    });


    particles =
        particles.filter(
            p=>p.life>0
        );


    /* FLOATING TEXT */

    floatingTexts.forEach(f=>{

        f.y -=
            .7*delta;

        f.life -=
            .018*delta;

    });


    floatingTexts =
        floatingTexts.filter(
            f=>f.life>0
        );


    if(shake>0){

        shake -=
            .5*delta;

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createBurst(
    x,
    y,
    color,
    count
){

    for(let i=0;i<count;i++){

        const angle =
            Math.random()*
            Math.PI*2;


        const speed =
            Math.random()*4+1;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            size:
                Math.random()*4+1,

            life:1,

            decay:
                .018+
                Math.random()*.025,

            color:color

        });

    }

}


function addFloatingText(
    x,
    y,
    text,
    color
){

    floatingTexts.push({

        x:x,

        y:y,

        text:text,

        color:color,

        life:1

    });

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(time){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#061b38"
    );

    gradient.addColorStop(
        .55,
        "#03172f"
    );

    gradient.addColorStop(
        1,
        "#020a18"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* GRID */

    const grid = 38;


    ctx.strokeStyle =
        "rgba(47,156,205,.12)";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* STARS */

    stars.forEach(s=>{

        s.y +=
            s.speed;


        if(s.y>750)
            s.y=0;


        const x =
            s.x*scaleX;

        const y =
            s.y*scaleY;


        ctx.globalAlpha =
            s.alpha;


        ctx.fillStyle =
            "#e9fbff";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            s.r,
            0,
            Math.PI*2
        );


        ctx.fill();

    });


    ctx.globalAlpha=1;


    /* BACKGROUND GLOW */

    const glow =
        ctx.createRadialGradient(
            W/2,
            H/2,
            20,
            W/2,
            H/2,
            Math.max(W,H)*.65
        );


    glow.addColorStop(
        0,
        "rgba(22,113,255,.08)"
    );


    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =====================================================
   CRYSTAL
===================================================== */

function drawCrystal(c){

    const x =
        c.x*scaleX;

    const y =
        c.y*scaleY;

    const size =
        c.size*scaleX;


    const pulse =
        Math.sin(c.pulse)*3;


    ctx.save();


    ctx.translate(
        x+size/2,
        y+size/2
    );


    ctx.rotate(
        Math.sin(
            c.pulse*.5
        )*.1
    );


    ctx.shadowBlur =
        25+pulse;


    ctx.shadowColor =
        "#ffd426";


    ctx.fillStyle =
        "#ffd426";


    ctx.beginPath();


    ctx.moveTo(
        0,
        -16-pulse
    );


    ctx.lineTo(
        13,
        0
    );


    ctx.lineTo(
        0,
        17+pulse
    );


    ctx.lineTo(
        -13,
        0
    );


    ctx.closePath();


    ctx.fill();


    ctx.fillStyle =
        "#fff7a6";


    ctx.beginPath();


    ctx.moveTo(
        0,
        -10
    );


    ctx.lineTo(
        6,
        0
    );


    ctx.lineTo(
        0,
        5
    );


    ctx.lineTo(
        -5,
        0
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

    const x =
        player.x*scaleX;

    const y =
        player.y*scaleY;

    const size =
        player.size*scaleX;


    const cx =
        x+size/2;

    const cy =
        y+size/2;


    /* TRAIL */

    player.tail.forEach(
        (t,i)=>{

            const alpha =
                (1-i/player.tail.length)*.5;


            const tx =
                t.x*scaleX;

            const ty =
                t.y*scaleY;


            ctx.save();


            ctx.globalAlpha =
                alpha;


            ctx.fillStyle =
                "#249cff";


            ctx.shadowBlur =
                18;


            ctx.shadowColor =
                "#249cff";


            ctx.beginPath();


            ctx.arc(
                tx,
                ty,
                4+
                (1-i/player.tail.length)*7,
                0,
                Math.PI*2
            );


            ctx.fill();


            ctx.restore();

        }
    );


    ctx.save();


    ctx.shadowBlur = 30;


    ctx.shadowColor =
        player.invincible>.35
        ? "#ff4168"
        : "#249cff";


    ctx.fillStyle =
        player.invincible>.35
        ? "#ff4168"
        : "#249cff";


    ctx.beginPath();


    ctx.roundRect(
        x,
        y,
        size,
        size,
        9
    );


    ctx.fill();


    /* SHIELD */

    ctx.shadowBlur=0;


    ctx.fillStyle =
        "#d5f7ff";


    ctx.beginPath();


    ctx.moveTo(
        cx,
        y+8
    );


    ctx.lineTo(
        x+size-8,
        cy-3
    );


    ctx.lineTo(
        cx,
        y+size-6
    );


    ctx.lineTo(
        x+8,
        cy-3
    );


    ctx.closePath();


    ctx.fill();


    /* HELMET */

    ctx.fillStyle =
        "#e7fbff";


    ctx.fillRect(
        x+9,
        y+5,
        size-18,
        12
    );


    /* VISOR */

    ctx.fillStyle =
        "#18384e";


    ctx.fillRect(
        x+11,
        y+10,
        size-22,
        5
    );


    /* EYES */

    ctx.fillStyle =
        "#54f4ff";


    ctx.shadowBlur =
        10;


    ctx.shadowColor =
        "#54f4ff";


    ctx.fillRect(
        x+13,
        y+11,
        4,
        3
    );


    ctx.fillRect(
        x+23,
        y+11,
        4,
        3
    );


    ctx.restore();

}

function drawEnemy(enemy){

    ctx.save();

        ? "#ffffff"
        : enemy.color;


    ctx.beginPath();


    ctx.roundRect(
        x,
        y,
        size,
        size,
        9
    );


    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#fff";


    ctx.fillRect(
        x+9,
        y+12,
        6,
        7
    );


    ctx.fillRect(
        x+23,
        y+12,
        6,
        7
    );


    ctx.fillStyle="#111522";


    ctx.fillRect(
        x+11,
        y+14,
        3,
        4
    );


    ctx.fillRect(
        x+25,
        y+14,
        3,
        4
    );


    /* ENEMY HP */

    const hpWidth =
        size;


    ctx.fillStyle =
        "rgba(0,0,0,.5)";


    ctx.fillRect(
        x,
        y-10,
        hpWidth,
        4
    );


    ctx.fillStyle =
        "#ff4168";


    ctx.fillRect(
        x,
        y-10,
        hpWidth*
        (enemy.hp/enemy.maxHp),
        4
    );


    ctx.restore();

    ){

            enemy.color;


        miniCtx.shadowBlur=8;

        miniCtx.shadowColor =
            enemy.color;


        miniCtx.beginPath();


        miniCtx.arc(
            enemy.x*sx,
            enemy.y*sy,
            6,
            0,
            Math.PI*2
        );


        miniCtx.fill();

    });


    /* ONLINE PLAYERS */

    onlinePlayers.forEach(p=>{

        miniCtx.fillStyle =
            p.color;


        miniCtx.shadowBlur=8;

        miniCtx.shadowColor =
            p.color;


        miniCtx.beginPath();


        miniCtx.arc(
            p.x*sx,
            p.y*sy,
            5,
            0,
            Math.PI*2
        );


        miniCtx.fill();

    });


    /* PLAYER */

    miniCtx.fillStyle =
        "#54e7ff";


    miniCtx.shadowBlur=12;

    miniCtx.shadowColor =
        "#54e7ff";


    miniCtx.beginPath();


    miniCtx.arc(
        (player.x+20)*sx,
        (player.y+20)*sy,
        8,
        0,
        Math.PI*2
    );


    miniCtx.fill();


    miniCtx.shadowBlur=0;

}


/* =====================================================
   DRAW
===================================================== */

function draw(time){

    ctx.save();


    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }


    drawBackground(time);


    crystals.forEach(
        drawCrystal
    );


    onlinePlayers.forEach(
        drawOnlinePlayer
    );


    enemies.forEach(
        drawEnemy
    );


    drawProjectiles();

    drawPlayer();

    drawParticles();

    drawFloatingTexts();


    ctx.restore();


    drawMiniMap();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document
    .getElementById("scoreText")
    .textContent =
        score;


    document
    .getElementById("hpText")
    .textContent =
        Math.max(
            0,
            Math.ceil(player.hp)
        ) +
        "/100";


    document
    .getElementById("hpFill")
    .style.width =
        Math.max(
            0,
            player.hp
        ) +
        "%";


    document
    .getElementById("myScore")
    .textContent =
        score;

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    initAudio();

    playSound("click");


    score=0;

    gameOver=false;

    paused=false;


    player.hp=100;

    player.x=600;

    player.y=375;

    player.tail=[];


    attackCooldown=0;

    particles=[];

    projectiles=[];

    floatingTexts=[];


    enemies[0].x=780;
    enemies[0].y=570;
    enemies[0].hp=100;


    enemies[1].x=930;
    enemies[1].y=250;
    enemies[1].hp=100;


    createCrystals();


    updateHUD();


    hideOverlay(
        "gameOverOverlay"
    );


    hideOverlay(
        "pauseOverlay"
    );


    showToast(
        "⚔️ Arena siap!"
    );

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(gameOver)
        return;


    initAudio();

    playSound("click");


    paused =
        !paused;


    if(paused){

        showOverlay(
            "pauseOverlay"
        );

    }

    else{

        hideOverlay(
            "pauseOverlay"
        );

    }

}


/* =====================================================
   OVERLAY
===================================================== */

function showOverlay(id){

    document
    .getElementById(id)
    .classList
    .add("show");

}


function hideOverlay(id){

    document
    .getElementById(id)
    .classList
    .remove("show");

}


document
.querySelectorAll("[data-close]")
.forEach(btn=>{

    btn.onclick=()=>{

        initAudio();

        playSound("click");


        hideOverlay(
            btn.dataset.close
        );

    };

});


/* =====================================================
   TOAST
===================================================== */

let toastTimer=null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            2000
        );

}


/* =====================================================
   SAVE
===================================================== */

function saveGame(){

    initAudio();

    playSound("click");


    const data={

        score:score,

        hp:player.hp,

        x:player.x,

        y:player.y

    };


    localStorage.setItem(
        "cubesKnightSave",
        JSON.stringify(data)
    );


    showToast(
        "💾 Game berhasil disimpan!"
    );

}


/* =====================================================
   LOAD
===================================================== */

function loadGame(){

    initAudio();

    playSound("click");


    const raw =
        localStorage.getItem(
            "cubesKnightSave"
        );


    if(!raw){

        showToast(
            "📂 Belum ada save!"
        );

        return;

    }


    try{

        const data =
            JSON.parse(raw);


        score =
            data.score ?? 0;


        player.hp =
            data.hp ?? 100;


        player.x =
            data.x ?? 600;


        player.y =
            data.y ?? 375;


        gameOver=false;

        paused=false;


        updateHUD();


        hideOverlay(
            "pauseOverlay"
        );


        showToast(
            "📂 Save berhasil dimuat!"
        );

    }

    catch{

        showToast(
            "❌ Save rusak!"
        );

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

function updateLeaderboard(){

    const list=[

        {
            name:"CubesAdv_Knight",
            score:score
        },

        {
            name:"ShadowFox",
            score:120
        },

        {
            name:"CrystalFox",
            score:90
        },

        {
            name:"RedKnight",
            score:70
        },

        {
            name:"MoonBlade",
            score:55
        }

    ];


    list.sort(
        (a,b)=>
            b.score-a.score
    );


    document
    .getElementById(
        "leaderboardBody"
    )
    .innerHTML =

        list.map(
            (p,i)=>`

                <tr>

                    <td>${i+1}</td>

                    <td>${p.name}</td>

                    <td>${p.score}</td>

                </tr>

            `
        )
        .join("");

}


/* =====================================================
   BUTTONS
===================================================== */

document
.getElementById("attackButton")
.addEventListener(
    "click",
    attack
);


document
.getElementById("pauseButton")
.onclick =
    togglePause;


document
.getElementById("soundButton")
.onclick = ()=>{

    soundEnabled =
        !soundEnabled;


    const button =
        document.getElementById(
            "soundButton"
        );


    if(soundEnabled){

        button.textContent =
            "🔊 SOUND ON";

        initAudio();

        playSound("click");

    }

    else{

        button.textContent =
            "🔇 SOUND OFF";

    }

};


document
.getElementById("resumeBtn")
.onclick =
    ()=>{

        initAudio();

        playSound("click");


        paused=false;


        hideOverlay(
            "pauseOverlay"
        );

    };


document
.getElementById("restartBtn")
.onclick =
    resetGame;


document
.getElementById("saveBtn")
.onclick =
    saveGame;


document
.getElementById("loadBtn")
.onclick =
    loadGame;


document
.getElementById("playersBtn")
.onclick =
    ()=>{

        initAudio();

        playSound("click");


        hideOverlay(
            "pauseOverlay"
        );


        showOverlay(
            "playersOverlay"
        );

    };


document
.getElementById("rankBtn")
.onclick =
    ()=>{

        initAudio();

        playSound("click");


        hideOverlay(
            "pauseOverlay"
        );


        updateLeaderboard();


        showOverlay(
            "rankOverlay"
        );

    };


document
.getElementById("gameOverRestart")
.onclick =
    resetGame;


document
.getElementById("gameOverRank")
.onclick =
    ()=>{

        initAudio();

        playSound("click");


        hideOverlay(
            "gameOverOverlay"
        );


        updateLeaderboard();


        showOverlay(
            "rankOverlay"
        );

    };


/* =====================================================
   FIRST CLICK = ENABLE AUDIO
===================================================== */

document.addEventListener(
    "pointerdown",
    ()=>{
        initAudio();
    },
    {
        once:false
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    const dt =
        time-lastTime;


    lastTime=time;


    update(dt);


    draw(time);


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   START
===================================================== */

updateHUD();

updateLeaderboard();

requestAnimationFrame(
    gameLoop
);

</script>
