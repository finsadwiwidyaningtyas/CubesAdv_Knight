<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CubesAdv Knight — SMKN 1 Sanden</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Segoe UI,Arial,sans-serif;
  background:#020817;
  color:#eaf8ff;
}

button{
  font:inherit;
  color:inherit;
}

/* ================= BACKGROUND ================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#07305c 0,transparent 35%),
    radial-gradient(circle at 80% 20%,#3b1260 0,transparent 25%),
    linear-gradient(#031a35,#020817 72%);
}

#game:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.45;
  background-image:
    linear-gradient(#1a76a92b 1px,transparent 1px),
    linear-gradient(90deg,#1a76a92b 1px,transparent 1px);
  background-size:46px 46px;
}

#game:after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(#fff9 1px,transparent 1.5px);
  background-size:83px 77px;
  opacity:.28;
  pointer-events:none;
}

/* ================= HUD ================= */

.hud{
  position:absolute;
  z-index:20;
  background:#03142ae0;
  border:1px solid #3bdfff55;
  border-radius:18px;
  backdrop-filter:blur(12px);
  box-shadow:
    0 0 25px #008cff18,
    inset 0 0 20px #00b7ff08;
}

/* ================= BRAND ================= */

.brand{
  left:18px;
  top:18px;
  width:310px;
  padding:12px;
  display:flex;
  gap:12px;
  align-items:center;
}

.logo-main{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:15px;
  padding:5px;
  background:
    radial-gradient(circle,#0c3960,#031326);
  border:1px solid #45e6ff88;
  box-shadow:
    0 0 15px #21dfff55,
    inset 0 0 15px #21dfff18;
}

.brand-title{
  font-size:17px;
  font-weight:900;
}

.brand-title b{
  color:#49eaff;
}

.sub{

  letter-spacing:1.4px;

}

/* ================= STATS ================= */

.stats{
  left:18px;
  top:98px;
  width:310px;
  padding:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  font-weight:900;
}

.hpbar{
  height:15px;
  background:#12263e;
  border-radius:99px;
  margin-top:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:76%;

  box-shadow:0 0 14px #42e8ff;
  transition:.2s;
}

.score{
  font-size:13px;
  margin-top:9px;
}

.score b{
  color:#ffd447;

/* ================= ONLINE ================= */

.online{
  right:20px;

}

.online i{
  display:inline-block;
  width:10px;

  border-radius:50%;

  margin-right:7px;
}

/* ================= MAP ================= */

.map{
  right:20px;
  top:76px;
  width:305px;
  height:210px;
  padding:10px;
}

.mapin{
  position:absolute;
  inset:10px;
  border:1px solid #42dcff55;
  border-radius:16px;
  background-image:
    linear-gradient(#38c5ef22 2px,transparent 2px),
    linear-gradient(90deg,#38c5ef22 2px,transparent 2px);
  background-size:35px 35px;
}

.dot{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  box-shadow:0 0 12px currentColor;
}

.a{
  left:18%;
  top:68%;
  background:#31f5bf;
  color:#31f5bf;
}

.b{
  left:72%;
  top:22%;
  background:#ff3c65;
  color:#ff3c65;
}

.c{
  left:66%;
  top:58%;
  background:#ffd426;
  color:#ffd426;
}

.d{
  left:58%;
  top:48%;
  width:15px;
  height:15px;
  background:#4ce9ff;
  color:#4ce9ff;
}

.e{
  left:61%;
  top:45%;
  background:#ff4f9a;
  color:#ff4f9a;
}

.f{
  left:78%;
  top:76%;
  background:#9c5cff;
  color:#9c5cff;
}

/* ================= NAV ================= */

.nav{
  position:absolute;
  right:20px;
  top:305px;
  z-index:25;
  display:flex;
  gap:8px;
}

.nav button{
  background:#03162ce8;
  border:1px solid #38d8ff55;
  border-radius:14px;
  padding:11px 16px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.nav button:hover{
  transform:translateY(-2px);
  border-color:#43eaff;
  box-shadow:0 0 15px #18cfff55;
}

/* ================= ARENA ================= */

.arena{
  position:absolute;
  inset:0;
}

.player{
  position:absolute;
  left:48%;
  top:54%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:16px;
  background:linear-gradient(145deg,#32abff,#1686ff);
  border:2px solid #50e5ff;
  box-shadow:
    0 0 15px #198fff,
    0 0 40px #ff3f9155;
  z-index:8;
  transition:.07s;
}

.player:before{
  content:"◆";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#eaffff;
  font-size:30px;
}

.visor{
  position:absolute;
  top:14px;
  left:16px;
  width:28px;
  height:10px;
  background:#b8fbff;
  border:2px solid #0876a2;
  border-radius:3px;
}

.beam{
  position:absolute;
  bottom:100%;
  left:50%;
  width:18px;
  height:130px;
  transform:translateX(-50%);
  background:linear-gradient(transparent,#2fbfff66);
  filter:blur(3px);
}

/* ================= ENEMY ================= */

.enemy{
  position:absolute;
  width:48px;
  height:48px;
  transform:translate(-50%,-50%);
  border-radius:13px;
  background:linear-gradient(145deg,#b55cff,#763aff);
  border:2px solid #d9a0ff;
  box-shadow:0 0 20px #9b5cff;
  z-index:7;
}

.enemy span{
  position:absolute;
  bottom:100%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-weight:900;
  font-size:13px;
  margin-bottom:7px;
  text-shadow:0 2px 8px #000;
}

.enemy:after{
  content:"";
  position:absolute;
  inset:10px;
  border:2px solid #fff8;
  border-radius:7px;
}

/* ================= GEM ================= */

.gem{
  position:absolute;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%) rotate(45deg);
  border-radius:7px;
  background:linear-gradient(145deg,#21f0cf,#218cff);
  border:1px solid #b9ffff;
  box-shadow:
    0 0 20px #25e4ff,
    0 0 45px #218cff66;
  animation:float 1.3s infinite ease-in-out;
}

.gem:after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid #fff9;
}

@keyframes float{
  50%{
    margin-top:-8px;
  }
}

/* ================= SCHOOL LOGOS ================= */

.logos{
  position:absolute;
  right:350px;
  bottom:25px;
  display:flex;
  gap:10px;
  z-index:15;
  align-items:center;
}

.school-logo{
  width:62px;
  height:62px;
  object-fit:contain;
  padding:6px;
  border-radius:17px;
  background:#031326dd;
  border:1px solid #46dcff66;
  box-shadow:
    0 0 18px #17cfff22,
    inset 0 0 15px #17cfff0d;
  transition:.25s;
}

.school-logo:hover{
  transform:translateY(-5px) scale(1.08);
  border-color:#56eaff;
  box-shadow:
    0 0 25px #20dfff66,
    inset 0 0 20px #20dfff15;
}

/* ================= CONTROLS ================= */

.controls{
  position:absolute;
  left:22px;
  bottom:22px;
  z-index:30;
  display:grid;
  grid-template:74px 74px/74px 74px 74px;
  gap:9px;
}

.ctrl{
  border-radius:18px;
  background:#041930d0;
  border:1px solid #26d7ff80;
  box-shadow:inset 0 0 20px #00aaff0f;
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:900;
  cursor:pointer;
  touch-action:none;
  transition:.12s;
}

.ctrl:hover{
  background:#08365bd0;
  box-shadow:0 0 20px #17cfff33;
}

.ctrl:active{
  transform:scale(.92);
}

.up{
  grid-column:2;
}

.left{
  grid-row:2;
}

.down{
  grid-row:2;
  grid-column:2;
}

.right{
  grid-row:2;
  grid-column:3;
}

/* ================= ATTACK ================= */

.attack{
  position:absolute;
  right:38px;
  bottom:28px;
  width:300px;
  height:86px;
  border:0;
  border-radius:25px;
  background:linear-gradient(105deg,#e12d7d,#a72cc4);
  box-shadow:
    0 0 35px #eb289155,
    inset 0 0 20px #fff2;
  z-index:30;
  font-weight:950;
  font-size:21px;
  cursor:pointer;
  transition:.15s;
}

.attack:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 50px #eb289177,
    inset 0 0 25px #fff3;
}

.attack:active{
  transform:scale(.96);
}

/* ================= TOAST ================= */

.toast{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  opacity:0;
  z-index:100;
  background:#041126f2;
  border:1px solid #4de8ff;
  border-radius:16px;
  padding:15px 22px;
  font-weight:950;
  transition:.2s;
  pointer-events:none;
  box-shadow:0 0 30px #00cfff22;
}

.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* ================= MODAL ================= */

.modal{
  display:none;
  place-items:center;
  position:absolute;
  inset:0;
  z-index:90;
  background:#0009;
  backdrop-filter:blur(9px);
}

.card{
  width:min(450px,90vw);
  padding:28px;
  text-align:center;
  border-radius:24px;
  background:#05122af5;
  border:1px solid #43e2ff66;
  box-shadow:0 0 40px #00cfff22;
}

.card h2{
  margin-bottom:10px;
}

.card p{
  color:#91afc4;
  line-height:1.6;
}

.card button{
  margin-top:18px;
  padding:12px 24px;
  border-radius:13px;
  background:#0b7cff;
  border:1px solid #6eeaff;
  font-weight:900;
  cursor:pointer;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .brand,
  .stats{
    width:220px;
  }

  .map{
    width:220px;
    height:155px;
  }

  .nav{

  }

  }

    display:none;
  }
}

@media(max-width:650px){

  .brand{
    left:10px;
    top:10px;

  }

  .logo-main{
    width:43px;

  .sub{
    display:none;

  }

    width:52px;

  }
}
</style>

<!-- ================= HEADER + LOGO SEKOLAH ================= -->

<script>

/* =========================================================
   GAME VARIABLES
========================================================= */

const p =
  document.getElementById('player');

const hpEl =
  document.getElementById('hp');

const fill =
  document.getElementById('fill');

const sc =
  document.getElementById('score');

const gm =
  document.getElementById('gems');

const t =
  document.getElementById('toast');

const modal =
  document.getElementById('modal');

let x = 48;
let y = 54;

let hp = 76;
let score = 0;
let gems = 0;

let paused = false;

let keys = {};


/* =========================================================
   CLAMP
========================================================= */

const clamp =
(v,a,b) =>
Math.max(a,Math.min(b,v));


/* =========================================================
   RENDER
========================================================= */

function render(){

  p.style.left =
    x + '%';

  p.style.top =
    y + '%';

  hpEl.textContent =
    hp + '/100';

  fill.style.width =
    hp + '%';

  sc.textContent =
    score;

  gm.textContent =
    gems;
}


/* =========================================================
   MOVE
========================================================= */

function move(dx,dy){

  if(paused)
    return;

  x =
    clamp(
      x + dx,
      5,
      95
    );

  y =
    clamp(
      y + dy,
      16,
      90
    );

  render();
}


/* =========================================================
   TOAST
========================================================= */

function toast(s){

  t.textContent =
    s;

  t.classList.add('show');

  clearTimeout(
    window.tt
  );

  window.tt =
    setTimeout(
      () =>
        t.classList.remove('show'),
      850
    );
}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

  if(
    paused ||
    hp <= 0
  )
    return;

  score += 10;

  if(
    Math.random() < .35
  ){

    gems++;

    toast(
      '💎 +1 GEM!'
    );

  }else{

    toast(
      '⚔️ SERANG! +10 SCORE'
    );

  }

  if(
    Math.random() < .22
  ){

    hp =
      Math.max(
        0,
        hp - 3
      );

    toast(
      '💥 -3 HP'
    );

  }

  render();

  if(hp <= 0){

    toast(
      '☠️ Kalah — tekan R'
    );

  }

}


/* =========================================================
   PAUSE
========================================================= */

function pause(){

  paused =
    !paused;

  modal.style.display =
    paused
      ? 'grid'
      : 'none';
}


/* =========================================================
   KEYBOARD
========================================================= */

window.onkeydown =
function(e){

  keys[e.key] = 1;

  if(
    e.code === 'Space'
  ){

    e.preventDefault();

    attack();

  }

  if(
    e.key.toLowerCase()
    === 'p'
  ){

    pause();

  }

  if(
    e.key.toLowerCase()
    === 'r' &&
    hp <= 0
  ){

    hp = 76;

    score = 0;

    gems = 0;

    x = 48;

    y = 54;

    render();

    toast(
      '🔄 RESET'
    );

  }

};


/* =========================================================
   KEY UP
========================================================= */

window.onkeyup =
function(e){

  keys[e.key] = 0;

};


/* =========================================================
   MOVEMENT LOOP
========================================================= */

setInterval(
function(){

  if(paused)
    return;

  let dx = 0;
  let dy = 0;

  if(
    keys.ArrowLeft ||
    keys.a
  )
    dx -= .7;

  if(
    keys.ArrowRight ||
    keys.d
  )
    dx += .7;

  if(
    keys.ArrowUp ||
    keys.w
  )
    dy -= .7;

  if(
    keys.ArrowDown ||
    keys.s
  )
    dy += .7;

  if(
    dx ||
    dy
  )
    move(dx,dy);

},
30
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
.querySelectorAll('.ctrl')
.forEach(
function(b){

  b.onpointerdown =
  function(e){

    e.preventDefault();

    let k =
      b.dataset.k;

    move(
      k === 'ArrowLeft'
        ? -2.2
        : k === 'ArrowRight'
          ? 2.2
          : 0,

      k === 'ArrowUp'
        ? -2.2
        : k === 'ArrowDown'
          ? 2.2
          : 0
    );

  };

});


/* =========================================================
   SCORE TIMER
========================================================= */

setInterval(
function(){

  if(!paused){

    score++;

    render();

  }

},
1500
);


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
