<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubesAdv_Knight</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e1e2d;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        #gameCanvas {
            border: 3px solid #34495e;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            background-color: #1e1e2d;
        }

        .instructions {
            margin-top: 15px;
            text-align: center;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>CubesAdv_Knight ⚔️</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="instructions">
        <p>Gunakan <strong>WASD</strong> atau <strong>Tombol Panah</strong> untuk bergerak.</p>
        <p>Ambil Kristal Kuning (+10) dan hindari Musuh Merah!</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Konfigurasi Game & Warna
        const COLOR_BG = "#1e1e2d";
        const COLOR_KNIGHT = "#2980b9";
        const COLOR_CRYSTAL = "#f1c40f";
        const COLOR_ENEMY = "#e74c3c";
        const COLOR_TEXT = "#ecf0f1";

        // Status Tombol
        const keys = {};

        // Variabel Game
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height / 2 - 20,
            size: 40,
            speed: 5
        };

        const crystal = {
            x: 0,
            y: 0,
            size: 20
        };

        const enemy = {
            x: 0,
            y: 0,
            size: 35,
            speed: 2.5
        };

        let score = 0;
        let gameOver = false;

        // Pasang Posisi Acak Kristal & Musuh
        function resetPositions() {
            crystal.x = Math.floor(Math.random() * (canvas.width - crystal.size));
            crystal.y = Math.floor(Math.random() * (canvas.height - crystal.size));

            enemy.x = Math.floor(Math.random() * (canvas.width - enemy.size));
            enemy.y = Math.floor(Math.random() * (canvas.height - enemy.size));
        }

        function restartGame() {
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
            score = 0;
            gameOver = false;
            resetPositions();
        }

        // Event Listener Keyboard
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (gameOver && (e.key === 'r' || e.key === 'R')) {
                restartGame();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        // Deteksi Tabrakan (AABB Collision)
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.size &&
                rect1.x + rect1.size > rect2.x &&
                rect1.y < rect2.y + rect2.size &&
                rect1.y + rect1.size > rect2.y
            );
        }

        // Update Logic
        function update() {
            if (gameOver) return;

            // Pergerakan Player
            if ((keys["ArrowLeft"] || keys["a"] || keys["A"]) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys["ArrowRight"] || keys["d"] || keys["D"]) && player.x < canvas.width - player.size) {
                player.x += player.speed;
            }
            if ((keys["ArrowUp"] || keys["w"] || keys["W"]) && player.y > 0) {
                player.y -= player.speed;
            }
            if ((keys["ArrowDown"] || keys["s"] || keys["S"]) && player.y < canvas.height - player.size) {
                player.y += player.speed;
            }

            // Pergerakan AI Musuh (Mengejar Player)
            if (enemy.x < player.x) enemy.x += enemy.speed;
            else if (enemy.x > player.x) enemy.x -= enemy.speed;

            if (enemy.y < player.y) enemy.y += enemy.speed;
            else if (enemy.y > player.y) enemy.y -= enemy.speed;

            // Tabrakan dengan Kristal
            if (checkCollision(player, crystal)) {
                score += 10;
                crystal.x = Math.floor(Math.random() * (canvas.width - crystal.size));
                crystal.y = Math.floor(Math.random() * (canvas.height - crystal.size));
            }

            // Tabrakan dengan Musuh
            if (checkCollision(player, enemy)) {
                gameOver = true;
            }
        }

        // Render Graphics
        function draw() {
            // Bersihkan Canvas
            ctx.fillStyle = COLOR_BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameOver) {
                // Gambar Kristal
                ctx.fillStyle = COLOR_CRYSTAL;
                ctx.fillRect(crystal.x, crystal.y, crystal.size, crystal.size);

                // Gambar Musuh
                ctx.fillStyle = COLOR_ENEMY;
                ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);

                // Gambar Player (Knight)
                ctx.fillStyle = COLOR_KNIGHT;
                ctx.fillRect(player.x, player.y, player.size, player.size);

                // Tampilkan Skor
                ctx.fillStyle = COLOR_TEXT;
                ctx.font = "20px Arial";
                ctx.fillText(`Score: ${score}`, 15, 30);
            } else {
                // Tampilan Game Over
                ctx.fillStyle = COLOR_ENEMY;
                ctx.font = "bold 48px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 230);

                ctx.fillStyle = COLOR_TEXT;
                ctx.font = "22px Arial";
                ctx.fillText(`Skor Akhir: ${score}`, canvas.width / 2, 290);
                ctx.fillText("Tekan 'R' untuk Main Lagi", canvas.width / 2, 340);
                ctx.textAlign = "left"; // Reset alignment
            }
        }

        // Game Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Inisialisasi Game
        resetPositions();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
